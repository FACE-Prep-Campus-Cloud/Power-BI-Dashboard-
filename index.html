<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · FACE Prep Campus Help Desk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ── Brand — sampled from the FACE Prep Campus mark ── */
  --brand-1: #D11AB3;   /* magenta        */
  --brand-2: #EF6E5C;   /* coral          */
  --brand-3: #F6A968;   /* warm orange    */
  --brand-gradient: linear-gradient(120deg, var(--brand-1) 0%, var(--brand-2) 55%, var(--brand-3) 100%);

  --page-bg: #EEEFF3;
  --ink: #14151A;
  --text: #14151A;
  --text-light: #5B6270;
  --text-faint: #9199A6;
  --card: #FFFFFF;
  --illustration-bg: #FBF1F1;
  --border: #E7E9EC;
  --red: #DC2626;
  --shadow-card: 0 30px 60px -24px rgba(30,20,40,0.18), 0 10px 24px -12px rgba(30,20,40,0.10);
}
body[data-theme="dark"] {
  --page-bg: #101116;
  --ink: #F5F1F8;
  --text: #EDEEF2;
  --text-light: #ABB0BC;
  --text-faint: #767C88;
  --card: #1B1620;
  --illustration-bg: #221A22;
  --border: #322A38;
  --shadow-card: 0 30px 60px -24px rgba(0,0,0,0.6), 0 10px 24px -12px rgba(0,0,0,0.4);
}

html, body { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  transition: background .25s ease, color .25s ease;
}
button, input, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }

/* ── Page backdrop: quiet and light, so the card reads as its own object ── */
.auth-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px;
  position: relative;
  background: var(--page-bg);
}

.theme-toggle-auth {
  position: absolute; top: 20px; right: 20px; z-index: 5;
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(20,21,26,0.10); background: rgba(255,255,255,0.7);
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: rgba(20,21,26,0.65);
  box-shadow: 0 2px 8px -2px rgba(20,21,26,0.12); transition: transform .15s, color .15s, background .15s;
}
.theme-toggle-auth:hover { color: var(--ink); background: rgba(255,255,255,1); transform: translateY(-1px); }
.theme-toggle-auth svg { width: 16px; height: 16px; }
body[data-theme="dark"] .theme-toggle-auth { border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); }
body[data-theme="dark"] .theme-toggle-auth:hover { color: #fff; background: rgba(255,255,255,0.14); }

/* ── The card: one object, two zones ── */
.auth-card {
  width: 100%; max-width: 920px;
  background: var(--card);
  border-radius: 28px;
  box-shadow: var(--shadow-card);
  display: flex;
  overflow: hidden;
  animation: authRise .6s cubic-bezier(.16,1,.3,1) both;
}
@keyframes authRise { from { opacity: 0; transform: translateY(16px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* ── Left zone: illustration ── */
.auth-card-illustration {
  flex: 0 0 46%;
  background: var(--illustration-bg);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 56px 32px 0;
  position: relative;
  min-height: 620px;
  overflow: hidden;
}
@media (max-width: 820px) { .auth-card-illustration { display: none; } }

.char-crew {
  position: relative;
  width: 344px; height: 320px;
  margin-bottom: 46px;
  pointer-events: none;
}
.char-crew::after {
  /* contact shadow grounding the group */
  content: ''; position: absolute; left: 50%; bottom: -30px; transform: translateX(-50%);
  width: 260px; height: 26px; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(20,15,20,0.20) 0%, rgba(20,15,20,0.10) 45%, rgba(20,15,20,0) 75%);
  filter: blur(1px);
}
body[data-theme="dark"] .char-crew::after {
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.22) 45%, rgba(0,0,0,0) 75%);
}
.char { position: absolute; bottom: 0; animation: charBob 3.4s ease-in-out infinite; transform-origin: bottom center; }
.char.tall  { left: 6px;   z-index: 1; }
.char.mid   { left: 150px; z-index: 2; }
.char.small { left: 226px; z-index: 3; }
.char.dome  { left: 18px;  z-index: 4; }
.char:nth-child(2) { animation-delay: -0.6s; }
.char:nth-child(3) { animation-delay: -1.4s; }
.char:nth-child(4) { animation-delay: -2.1s; }
@keyframes charBob {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-7px) rotate(-1deg); }
}
.char-body {
  border-radius: 44px 44px 14px 14px;
  box-shadow: 0 20px 34px -14px rgba(20,21,26,0.35), inset 0 -14px 20px -6px rgba(0,0,0,0.14), inset 0 10px 16px -4px rgba(255,255,255,0.30);
  position: relative;
}
/* glossy highlight streak, gives the plastic/toy a rounded, lit-from-above feel */
.char-body::before {
  content: '';
  position: absolute; top: 10%; left: 14%;
  width: 30%; height: 22%;
  border-radius: 50%;
  background: rgba(255,255,255,0.45);
  filter: blur(3px);
  transform: rotate(-18deg);
}
/* soft blush, using two round shadows either side of the mouth */
.char-body::after {
  content: '';
  position: absolute; top: 46%; left: 50%; transform: translateX(-50%);
  width: 2px; height: 2px;
  box-shadow:
    -19px 0 0 9px rgba(255,255,255,0.16),
     19px 0 0 9px rgba(255,255,255,0.16);
  border-radius: 50%;
  filter: blur(2px);
  opacity: 0.7;
}

.char.tall .char-body  {
  width: 146px; height: 300px;
  background: linear-gradient(160deg, #9581FF 0%, #7C5CFC 55%, #6947E8 100%);
}
.char.mid .char-body   {
  width: 130px; height: 234px;
  background: linear-gradient(160deg, #ED4FCB 0%, var(--brand-1) 55%, #B3128F 100%);
  border-radius: 40px 40px 12px 12px;
}
.char.dome .char-body  {
  width: 254px; height: 144px;
  background: linear-gradient(160deg, #FFC48A 0%, var(--brand-3) 55%, #E8944C 100%);
  border-radius: 132px 132px 12px 12px;
}
.char.small .char-body {
  width: 110px; height: 200px;
  background: linear-gradient(160deg, #FFDA76 0%, #F6C445 55%, #E0A81F 100%);
  border-radius: 40px 40px 12px 12px;
}

/* stubby little arms, tucked at the sides, for a friendlier "real" character silhouette */
.char.tall .char-body::before { top: 8%; }
.char-arm {
  position: absolute; top: 46%; width: 22px; height: 46px; border-radius: 16px;
  box-shadow: inset 0 6px 10px -4px rgba(255,255,255,0.28), inset 0 -6px 10px -4px rgba(0,0,0,0.16);
}
.char.tall .char-arm.left   { left: -12px; background: linear-gradient(160deg, #9581FF, #7C5CFC); transform: rotate(8deg); }
.char.tall .char-arm.right  { right: -12px; background: linear-gradient(160deg, #9581FF, #7C5CFC); transform: rotate(-8deg); }
.char.mid .char-arm.left    { left: -11px; top: 42%; width: 20px; height: 40px; background: linear-gradient(160deg, #ED4FCB, var(--brand-1)); transform: rotate(10deg); }
.char.mid .char-arm.right   { right: -11px; top: 42%; width: 20px; height: 40px; background: linear-gradient(160deg, #ED4FCB, var(--brand-1)); transform: rotate(-10deg); }
.char.small .char-arm.left  { left: -10px; top: 40%; width: 18px; height: 36px; background: linear-gradient(160deg, #FFDA76, #F6C445); transform: rotate(12deg); }
.char.small .char-arm.right { right: -10px; top: 40%; width: 18px; height: 36px; background: linear-gradient(160deg, #FFDA76, #F6C445); transform: rotate(-12deg); }
.char.dome .char-arm { display: none; }

.char-eyes { position: absolute; top: 32%; left: 50%; transform: translateX(-50%); display: flex; gap: 21px; }
.char.dome .char-eyes { top: 38%; gap: 18px; }
.eye {
  width: 22px; height: 22px; border-radius: 50%; background: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 2px 3px rgba(0,0,0,0.18), 0 1px 1px rgba(255,255,255,0.6);
  transition: transform .12s ease;
}
.eye.blink { transform: scaleY(0.12) !important; }
.pupil { width: 9px; height: 9px; border-radius: 50%; background: #14151A; transition: transform .05s linear; position: relative; }
.pupil::after { content: ''; position: absolute; top: 1px; left: 1px; width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.85); }
.char-mouth { position: absolute; top: 56%; left: 50%; transform: translateX(-50%); width: 22px; height: 3px; background: #14151A; border-radius: 3px; opacity: 0.75; }
.char.tall .char-mouth  { width: 3px; height: 22px; top: 30%; }
.char.mid .char-mouth   { top: 54%; }
.char.dome .char-mouth  { width: 27px; height: 14px; border: 3px solid #14151A; border-top: none; border-radius: 0 0 27px 27px; background: none; top: 48%; }
.char.small .char-mouth { width: 23px; top: 53%; transform: translateX(-50%) rotate(-18deg); }
body[data-theme="dark"] .char-body { filter: brightness(0.92); }

@keyframes crewHappyJump {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  30%      { transform: translateY(-20px) rotate(-6deg); }
  55%      { transform: translateY(3px) rotate(4deg); }
  78%      { transform: translateY(-9px) rotate(-2deg); }
}
@keyframes crewSadShake {
  0%, 100% { transform: translateY(4px) rotate(0deg); }
  20%      { transform: translateY(4px) rotate(-4deg); }
  40%      { transform: translateY(4px) rotate(4deg); }
  60%      { transform: translateY(6px) rotate(-3deg); }
  80%      { transform: translateY(6px) rotate(3deg); }
}
@keyframes crewCurious {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  50%      { transform: rotate(-5deg) translateY(-4px); }
}
#char-crew.mood-happy .char { animation: crewHappyJump .7s ease-in-out; }
#char-crew.mood-happy .char:nth-child(2) { animation-delay: .06s; }
#char-crew.mood-happy .char:nth-child(3) { animation-delay: .12s; }
#char-crew.mood-happy .char:nth-child(4) { animation-delay: .18s; }
#char-crew.mood-happy .eye { transform: scale(1.18); }
#char-crew.mood-happy .char-mouth { transform: translateX(-50%) scaleX(1.4); background: #14151A; }
#char-crew.mood-happy .char.dome .char-mouth { transform: scale(1.2); }
#char-crew.mood-happy .char.small .char-mouth { transform: translateX(-50%) rotate(-18deg) scaleX(1.3); }

#char-crew.mood-sad .char { animation: crewSadShake .6s ease-in-out; }
#char-crew.mood-sad .eye { transform: scaleY(0.55) translateY(2px); }
#char-crew.mood-sad .char-mouth { transform: translateX(-50%) rotate(180deg); }
#char-crew.mood-sad .char.dome .char-mouth { transform: rotate(180deg) translateY(-2px); }
#char-crew.mood-sad .char.small .char-mouth { transform: translateX(-50%) rotate(198deg); }

#char-crew.mood-curious .char { animation: crewCurious .9s ease-in-out; }
#char-crew.mood-curious .eye { transform: scale(1.05); }

@media (prefers-reduced-motion: reduce) {
  .auth-card, .char, #char-crew.mood-happy .char, #char-crew.mood-sad .char, #char-crew.mood-curious .char {
    animation: none !important;
  }
}

/* ── Right zone: the form ── */
.auth-card-form {
  flex: 1 1 58%;
  background: var(--card);
  padding: 52px 56px;
  display: flex; flex-direction: column; justify-content: center;
}
@media (max-width: 820px) { .auth-card-form { flex: 1 1 100%; padding: 44px 30px; } }

.auth-logo-wrap { display: flex; justify-content: center; margin-bottom: 26px; }
.auth-logo { height: 38px; width: auto; display: block; }

.auth-header { text-align: center; margin-bottom: 26px; }
.auth-header h1 { font-family: 'Poppins','Inter',sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
.auth-header p  { font-size: 13.5px; color: var(--text-light); margin-top: 7px; line-height: 1.5; }

.auth-form-inner { max-width: 340px; width: 100%; margin: 0 auto; }

.auth-role-toggle { display: flex; gap: 8px; margin-bottom: 22px; background: rgba(20,21,26,0.05); padding: 4px; border-radius: 13px; }
body[data-theme="dark"] .auth-role-toggle { background: rgba(255,255,255,0.06); }
.role-tab {
  flex: 1; padding: 9px 8px; border-radius: 10px; border: none;
  background: transparent; color: var(--text-light); font-size: 12.5px; font-weight: 700;
  cursor: pointer; transition: background .15s, color .15s, box-shadow .15s; text-align: center;
}
.role-tab.active { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px -2px rgba(20,21,26,0.18); }

.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-light); margin-bottom: 7px; }
.field-group { margin-bottom: 14px; }

input, select {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 14.5px; padding: 11px 13px; outline: none; width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(239,110,92,0.15); }
input::placeholder { color: var(--text-faint); }
input[type=password] { letter-spacing: 0.12em; }

.error-msg { font-size: 13px; color: var(--red); margin: 4px 0 8px; text-align: center; animation: shake .35s ease; }
@keyframes shake {
  10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); }
  30%, 50%, 70% { transform: translateX(-4px); } 40%, 60% { transform: translateX(4px); }
}

.btn-auth {
  width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  position: relative; overflow: hidden; padding: 13px 16px; margin-top: 6px;
  background: var(--brand-gradient); background-size: 160% 160%;
  color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 0.01em;
  border: none; border-radius: 13px; cursor: pointer;
  transition: transform .1s, box-shadow .18s, background-position .4s ease;
  box-shadow: 0 10px 22px -8px rgba(209,26,179,0.40);
}
.btn-auth:hover { background-position: 100% 0; box-shadow: 0 14px 28px -8px rgba(209,26,179,0.5); }
.btn-auth:active { transform: scale(0.97); }
.btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.btn-auth .arrow { transition: transform .18s; }
.btn-auth:hover .arrow { transform: translateX(3px); }

.auth-footnote { text-align: center; font-size: 11.5px; color: var(--text-faint); margin-top: 20px; }

.success-icon {
  width: 54px; height: 54px; border-radius: 50%; background: var(--brand-gradient);
  display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  box-shadow: 0 10px 24px -8px rgba(209,26,179,0.5);
}
.success-icon svg { width: 24px; height: 24px; stroke: #fff; }
.success-role { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--brand-2); text-align: center; margin-bottom: 4px; }
.success-name { font-family: 'Poppins','Inter',sans-serif; font-size: 18px; font-weight: 700; text-align: center; color: var(--ink); margin-bottom: 18px; }
.btn-secondary {
  width: 100%; padding: 11px 16px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--card); color: var(--text-light); font-size: 13px; font-weight: 600; cursor: pointer;
  transition: color .15s, border-color .15s;
}
.btn-secondary:hover { color: var(--text); border-color: var(--brand-2); }

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="auth-wrap">
  <button class="theme-toggle-auth" onclick="toggleTheme()" id="theme-toggle-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
    <svg id="theme-toggle-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.5v1.4M8 13.1v1.4M2.6 8H1.2M14.8 8h-1.4M3.9 3.9l1 1M11.1 11.1l1 1M11.1 3.9l-1 1M3.9 11.1l1 1"/></svg>
  </button>

  <div class="auth-card">
    <div class="auth-card-illustration">
      <div class="char-crew" id="char-crew" aria-hidden="true">
        <div class="char tall">
          <div class="char-body">
            <span class="char-arm left"></span><span class="char-arm right"></span>
            <div class="char-eyes"><span class="eye"><span class="pupil"></span></span><span class="eye"><span class="pupil"></span></span></div>
            <div class="char-mouth"></div>
          </div>
        </div>
        <div class="char mid">
          <div class="char-body">
            <span class="char-arm left"></span><span class="char-arm right"></span>
            <div class="char-eyes"><span class="eye"><span class="pupil"></span></span><span class="eye"><span class="pupil"></span></span></div>
            <div class="char-mouth"></div>
          </div>
        </div>
        <div class="char small">
          <div class="char-body">
            <span class="char-arm left"></span><span class="char-arm right"></span>
            <div class="char-eyes"><span class="eye"><span class="pupil"></span></span><span class="eye"><span class="pupil"></span></span></div>
            <div class="char-mouth"></div>
          </div>
        </div>
        <div class="char dome">
          <div class="char-body">
            <div class="char-eyes"><span class="eye"><span class="pupil"></span></span><span class="eye"><span class="pupil"></span></span></div>
            <div class="char-mouth"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="auth-card-form">
      <div class="auth-form-inner">
        <div class="auth-logo-wrap">
          <img class="auth-logo" src="__LOGO_SRC__" alt="FACE Prep Campus" />
        </div>

        <!-- ── LOGIN PANEL ── -->
        <div id="login-panel">
          <div class="auth-header">
            <h1>Campus Help Desk</h1>
            <p>Sign in to manage tickets &amp; daily activity logs.</p>
          </div>

          <div class="auth-role-toggle">
            <button type="button" class="role-tab active" id="role-tab-kam" onclick="setAuthRole('kam')">KAM</button>
            <button type="button" class="role-tab" id="role-tab-manager" onclick="setAuthRole('manager')">Campus Manager</button>
          </div>

          <div id="kam-login-block">
            <div class="field-group">
              <label class="field-label">Login as</label>
              <select id="kam-select"></select>
            </div>
            <div class="field-group">
              <label class="field-label">PIN</label>
              <input id="kam-pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="Enter your PIN" />
            </div>
          </div>

          <div id="manager-login-block" class="hidden">
            <div class="field-group">
              <label class="field-label">College</label>
              <select id="manager-college-select"></select>
            </div>
            <div class="field-group">
              <label class="field-label">Manager PIN</label>
              <input id="manager-pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="Enter your PIN" />
            </div>
          </div>

          <div id="pin-error" class="error-msg hidden"></div>

          <button class="btn-auth" id="submit-btn" onclick="submitLogin()">
            <span id="submit-btn-label">Enter dashboard</span> <span class="arrow">→</span>
          </button>
        </div>

        <!-- ── SUCCESS PANEL ── -->
        <div class="hidden" id="success-panel">
          <div class="success-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg></div>
          <div class="success-role" id="success-role">Signed in</div>
          <div class="success-name" id="success-name">—</div>
          <button class="btn-secondary" onclick="doLogout()">Log out</button>
        </div>

        <div class="auth-footnote">Authorized personnel only · FACE Prep Campus</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   FACE Prep Campus — standalone login page
   Drop this file into your project. It queries the same
   `college_contacts` table as the main dashboard, so KAM and
   Campus Manager logins stay in sync with one source of truth.

   To integrate: replace handleLoginSuccess() below with
   whatever you use to route into the rest of your app.
   ═══════════════════════════════════════════════════════════ */

const SUPABASE_URL      = 'https://rysajbwcuieovbsllaas.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5c2FqYndjdWllb3Zic2xsYWFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NjI3MjgsImV4cCI6MjA5NjAzODcyOH0.2WenjYKsfQYAeUJxVJcEVQwqYUlfwrYltrMuC9Ggu4A';
const ADMIN_PIN = '1212'; // Master Admin PIN — change this for production
let sb = null;
try{
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(e){
  console.error('Supabase client failed to load (check the CDN script tag / network):', e);
}

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
function escHTML(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let authRole = 'kam';
let collegeContacts = [];

/* ── Theme ── */
function applyThemeIcon(){
  const dark = document.body.getAttribute('data-theme') === 'dark';
  const paths = dark
    ? '<path d="M13.5 9.3A5.8 5.8 0 0 1 6.7 2.5 5.8 5.8 0 1 0 13.5 9.3z"/>'
    : '<circle cx="8" cy="8" r="3.2"/><path d="M8 1.5v1.4M8 13.1v1.4M2.6 8H1.2M14.8 8h-1.4M3.9 3.9l1 1M11.1 11.1l1 1M11.1 3.9l-1 1M3.9 11.1l1 1"/>';
  $('theme-toggle-icon').innerHTML = paths;
}
function toggleTheme(){
  const cur = document.body.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  document.body.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  applyThemeIcon();
}
applyThemeIcon();

/* ── Character crew: eyes follow the cursor ── */
(function(){
  const crew = $('char-crew');
  if(!crew) return;
  const pupils = crew.querySelectorAll('.pupil');
  let targetX = 0, targetY = 0, curX = 0, curY = 0;
  document.addEventListener('mousemove', e => {
    const w = window.innerWidth, h = window.innerHeight;
    targetX = (e.clientX / w - 0.5) * 2;
    targetY = (e.clientY / h - 0.5) * 2;
  });
  function tick(){
    curX += (targetX - curX) * 0.12;
    curY += (targetY - curY) * 0.12;
    pupils.forEach(p => { p.style.transform = `translate(${curX*3}px, ${curY*2.8}px)`; });
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ── Character crew: occasional blink, per-eye ── */
function startCrewBlinking(){
  const eyes = document.querySelectorAll('#char-crew .eye');
  eyes.forEach(eye => {
    (function loopBlink(){
      const delay = 1800 + Math.random() * 3200;
      setTimeout(() => {
        eye.classList.add('blink');
        setTimeout(() => eye.classList.remove('blink'), 130);
        loopBlink();
      }, delay);
    })();
  });
}
startCrewBlinking();

/* ── Character crew: mood engine ── */
let crewMoodTimer = null;
function setCrewMood(mood, duration){
  const crew = $('char-crew');
  if(!crew) return;
  crew.classList.remove('mood-happy','mood-sad','mood-curious');
  void crew.offsetWidth;
  crew.classList.add('mood-' + mood);
  if(crewMoodTimer) clearTimeout(crewMoodTimer);
  crewMoodTimer = setTimeout(() => { crew.classList.remove('mood-' + mood); }, duration || 1000);
}
(function idleGestureLoop(){
  const delay = 9000 + Math.random() * 9000;
  setTimeout(() => {
    const crew = $('char-crew');
    if(crew && !crew.classList.contains('mood-happy') && !crew.classList.contains('mood-sad')){
      setCrewMood('curious', 900);
    }
    idleGestureLoop();
  }, delay);
})();

/* ── Role tabs ── */
function setAuthRole(role){
  authRole = role;
  $('role-tab-kam').classList.toggle('active', role==='kam');
  $('role-tab-manager').classList.toggle('active', role==='manager');
  $('kam-login-block').classList.toggle('hidden', role!=='kam');
  $('manager-login-block').classList.toggle('hidden', role!=='manager');
  hide('pin-error');
  setCrewMood('curious', 800);
}

/* ── Load colleges / KAMs from Supabase ── */
function populateCollegeDropdown(){
  const sel = $('manager-college-select');
  const names = [...new Set(collegeContacts.map(c => c.college))].sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = names.length
    ? '<option value="" disabled selected>Select your college</option>' +
      names.map(n => `<option value="${escHTML(n)}">${escHTML(n)}</option>`).join('')
    : '<option value="">No colleges configured yet</option>';
}
function buildKamList(){
  const map = {};
  collegeContacts.forEach(c => {
    if(c.senior_manager_name){
      if(!map[c.senior_manager_name]) map[c.senior_manager_name] = { name: c.senior_manager_name, pin: c.senior_manager_pin, colleges: [] };
      map[c.senior_manager_name].colleges.push(c.college);
    }
  });
  return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name));
}
function populateKamDropdown(){
  const sel = $('kam-select');
  const kams = buildKamList();
  sel.innerHTML = '<option value="" disabled selected>Select login</option>' +
    '<option value="__master__">Master Admin (All Colleges)</option>' +
    kams.map(k => `<option value="${escHTML(k.name)}">${escHTML(k.name)}</option>`).join('');
}
async function loadCollegeContacts(){
  populateCollegeDropdown();
  populateKamDropdown();
  if(!sb) return;
  try{
    const { data, error } = await sb.from('college_contacts')
      .select('college,senior_manager_name,senior_manager_pin,campus_manager_name,campus_manager_pin,zone');
    if(error) throw error;
    collegeContacts = data || [];
  }catch(e){
    console.error('Could not load college_contacts:', e);
  }
  populateCollegeDropdown();
  populateKamDropdown();
}
loadCollegeContacts();

/* ── Submit ── */
function submitLogin(){
  if(authRole === 'kam') submitKamLogin();
  else submitManagerLogin();
}
function submitKamLogin(){
  const err = $('pin-error');
  const sel = ($('kam-select').value || '').trim();
  const pin = ($('kam-pin-input').value || '').trim();
  if(!sel){ err.textContent = 'Please select a login.'; show('pin-error'); setCrewMood('sad', 800); return; }
  if(!pin){ err.textContent = 'Enter your PIN.'; show('pin-error'); setCrewMood('sad', 800); return; }
  if(sel === '__master__'){
    if(pin !== ADMIN_PIN){ failPin('kam-pin-input', 'Incorrect PIN.'); return; }
    hide('pin-error');
    handleLoginSuccess({ role: 'admin', name: 'Master Admin', colleges: null });
    return;
  }
  const rec = buildKamList().find(k => k.name === sel);
  if(!rec || !rec.pin || String(rec.pin) !== pin){ failPin('kam-pin-input', 'Incorrect PIN for this KAM.'); return; }
  hide('pin-error');
  handleLoginSuccess({ role: 'kam', name: rec.name, colleges: rec.colleges.slice() });
}
function submitManagerLogin(){
  const err = $('pin-error');
  const college = $('manager-college-select').value;
  const pin = ($('manager-pin-input').value || '').trim();
  if(!college){ err.textContent = 'Select your college.'; show('pin-error'); setCrewMood('sad', 800); return; }
  if(!pin){ err.textContent = 'Enter your PIN.'; show('pin-error'); setCrewMood('sad', 800); return; }
  const rec = collegeContacts.find(c => c.college === college);
  const expected = rec ? rec.campus_manager_pin : null;
  if(!rec || !expected || String(expected) !== pin){ failPin('manager-pin-input', 'Incorrect PIN for this college.'); return; }
  hide('pin-error');
  handleLoginSuccess({ role: 'manager', name: college, colleges: [college] });
}
function failPin(inputId, msg){
  $('pin-error').textContent = msg;
  show('pin-error');
  $(inputId).value = '';
  $(inputId).focus();
  setCrewMood('sad', 1100);
}

/* ── What happens after a valid PIN ── */
function handleLoginSuccess(session){
  window.FacePrepSession = session;
  setCrewMood('happy', 1300);
  setTimeout(() => {
    hide('login-panel');
    const roleLabel = { admin: 'Master Admin', kam: 'KAM', manager: 'Campus Manager' }[session.role];
    $('success-role').textContent = 'Signed in · ' + roleLabel;
    $('success-name').textContent = session.name;
    show('success-panel');
  }, 550);
}
function doLogout(){
  window.FacePrepSession = null;
  $('kam-pin-input').value = '';
  $('manager-pin-input').value = '';
  hide('success-panel');
  hide('pin-error');
  show('login-panel');
  setCrewMood('curious', 700);
}

document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(['manager-pin-input','manager-college-select','kam-pin-input','kam-select'].includes(e.target.id)){
    e.preventDefault();
    submitLogin();
  }
});
</script>
