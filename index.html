<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · FACE Prep Campus Help Desk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Poppins:wght@600;700;800&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ── Brand — sampled from the FACE Prep Campus mark ── */
  --brand-1: #D11AB3;   /* magenta        */
  --brand-2: #EF6E5C;   /* coral          */
  --brand-3: #F6A968;   /* warm orange    */
  --brand-gradient: linear-gradient(120deg, var(--brand-1) 0%, var(--brand-2) 55%, var(--brand-3) 100%);

  --ink: #14151A;
  --text: #14151A;
  --text-light: #5B6270;
  --text-faint: #9199A6;
  --card: #FFFFFF;
  --border: #E7E9EC;
  --red: #DC2626;
  --shadow-md: 0 4px 16px -6px rgba(20,21,26,0.10);
  --shadow-lg: 0 24px 60px -20px rgba(140,30,110,0.28);
}
body[data-theme="dark"] {
  --ink: #F5F1F8;
  --text: #EDEEF2;
  --text-light: #ABB0BC;
  --text-faint: #767C88;
  --card: #1B1620;
  --border: #322A38;
  --shadow-lg: 0 24px 60px -18px rgba(0,0,0,0.65);
}

html, body { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  transition: background .25s ease, color .25s ease;
}
button, input, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }

/* ── Backdrop: sky, with a warm brand glow instead of generic blobs ── */
.auth-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, #BFE0F5 0%, #D8ECFA 35%, #EAF4FB 65%, #F7FBFE 100%);
}
body[data-theme="dark"] .auth-wrap {
  background: linear-gradient(180deg, #120E17 0%, #170F1B 45%, #1B1420 100%);
}
.auth-wrap::before {
  content:''; position:absolute; left:0; right:0; bottom:-40px; height:240px; pointer-events:none;
  background: radial-gradient(ellipse 60% 100% at 20% 100%, rgba(255,255,255,0.95), transparent 60%),
              radial-gradient(ellipse 50% 100% at 60% 100%, rgba(255,255,255,0.9), transparent 55%),
              radial-gradient(ellipse 70% 100% at 90% 100%, rgba(255,255,255,0.85), transparent 60%);
}
body[data-theme="dark"] .auth-wrap::before { opacity: 0.05; }

.auth-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; pointer-events: none; animation: blobFloat 20s ease-in-out infinite; }
.auth-blob.b1 { width: 420px; height: 420px; top: -110px; left: -120px; background: var(--brand-1); animation-duration: 19s; }
.auth-blob.b2 { width: 460px; height: 460px; bottom: -130px; right: -110px; background: var(--brand-3); animation-duration: 23s; animation-delay: -4s; }
body[data-theme="dark"] .auth-blob { opacity: 0.4; }
@keyframes blobFloat {
  0%, 100% { transform: translate(0,0) scale(1); }
  33%      { transform: translate(28px,-22px) scale(1.07); }
  66%      { transform: translate(-20px,16px) scale(0.96); }
}

/* ── Googly character companions — grouped & aligned like the reference,
   colored from the FACE Prep brand palette (magenta / coral-orange / violet / gold).
   Sits inside .auth-stage, bottom-aligned right next to the login card, exactly
   like the illustration panel sits next to the form in the reference. ── */
.auth-stage {
  position: relative; z-index: 1;
  display: flex; align-items: flex-end; justify-content: center;
  gap: 46px;
}
.char-crew {
  position: relative; flex-shrink: 0;
  width: 200px; height: 190px;
  pointer-events: none;
}
@media (max-width: 900px) { .char-crew { display: none; } }
.char { position: absolute; bottom: 0; animation: charBob 3.4s ease-in-out infinite; transform-origin: bottom center; }
.char.tall  { left: 0px;   z-index: 1; }
.char.mid   { left: 58px;  z-index: 2; }
.char.dome  { left: -16px; z-index: 3; }
.char.small { left: 108px; z-index: 4; }
.char:nth-child(2) { animation-delay: -0.6s; }
.char:nth-child(3) { animation-delay: -1.4s; }
.char:nth-child(4) { animation-delay: -2.1s; }
@keyframes charBob {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-8px) rotate(-1deg); }
}
.char-body {
  border-radius: 34px 34px 10px 10px;
  box-shadow: 0 18px 30px -14px rgba(20,21,26,0.35);
  position: relative;
}
.char.tall .char-body  { width: 92px;  height: 190px; background: #7C5CFC; }                 /* violet — back */
.char.mid .char-body   { width: 82px;  height: 148px; background: var(--brand-1); border-radius: 30px 30px 8px 8px; } /* magenta */
.char.dome .char-body  { width: 160px; height: 92px;  background: var(--brand-3); border-radius: 90px 90px 8px 8px; } /* warm orange */
.char.small .char-body { width: 72px;  height: 122px; background: #F6C445; border-radius: 30px 30px 8px 8px; }       /* gold */
.char-eyes { position: absolute; top: 34%; left: 50%; transform: translateX(-50%); display: flex; gap: 13px; }
.char.dome .char-eyes { top: 42%; gap: 11px; }
.eye {
  width: 14px; height: 14px; border-radius: 50%; background: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.15); transition: transform .12s ease;
}
.eye.blink { transform: scaleY(0.12) !important; }
.pupil { width: 5.5px; height: 5.5px; border-radius: 50%; background: #14151A; transition: transform .05s linear; }
.char-mouth { position: absolute; top: 58%; left: 50%; transform: translateX(-50%); width: 15px; height: 2px; background: #14151A; border-radius: 2px; opacity: 0.75; }
.char.tall .char-mouth  { width: 2px; height: 15px; top: 32%; }
.char.mid .char-mouth   { top: 56%; }
.char.dome .char-mouth  { width: 18px; height: 9px; border: 2px solid #14151A; border-top: none; border-radius: 0 0 18px 18px; background: none; top: 50%; }
.char.small .char-mouth { width: 16px; top: 55%; transform: translateX(-50%) rotate(-18deg); }
body[data-theme="dark"] .char-body { filter: brightness(0.88); }

/* ── Moods — driven from the login script: sad on a wrong PIN,
   happy on a successful sign-in, curious when switching KAM / Campus Manager ── */
@keyframes crewHappyJump {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  30%      { transform: translateY(-20px) rotate(-6deg); }
  55%      { transform: translateY(3px) rotate(4deg); }
  78%      { transform: translateY(-9px) rotate(-2deg); }
}
@keyframes crewSadShake {
  0%, 100% { transform: translateY(4px) rotate(0deg); }
  20%      { transform: translateY(4px) rotate(-4deg); }
  40%      { transform: translateY(4px) rotate(4deg); }
  60%      { transform: translateY(6px) rotate(-3deg); }
  80%      { transform: translateY(6px) rotate(3deg); }
}
@keyframes crewCurious {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  50%      { transform: rotate(-5deg) translateY(-4px); }
}
#char-crew.mood-happy .char { animation: crewHappyJump .7s ease-in-out; }
#char-crew.mood-happy .char:nth-child(2) { animation-delay: .06s; }
#char-crew.mood-happy .char:nth-child(3) { animation-delay: .12s; }
#char-crew.mood-happy .char:nth-child(4) { animation-delay: .18s; }
#char-crew.mood-happy .eye { transform: scale(1.18); }
#char-crew.mood-happy .char-mouth { transform: translateX(-50%) scaleX(1.4); background: #14151A; }
#char-crew.mood-happy .char.dome .char-mouth { transform: scale(1.2); }
#char-crew.mood-happy .char.small .char-mouth { transform: translateX(-50%) rotate(-18deg) scaleX(1.3); }

#char-crew.mood-sad .char { animation: crewSadShake .6s ease-in-out; }
#char-crew.mood-sad .eye { transform: scaleY(0.55) translateY(2px); }
#char-crew.mood-sad .char-mouth { transform: translateX(-50%) rotate(180deg); }
#char-crew.mood-sad .char.dome .char-mouth { transform: rotate(180deg) translateY(-2px); }
#char-crew.mood-sad .char.small .char-mouth { transform: translateX(-50%) rotate(198deg); }

#char-crew.mood-curious .char { animation: crewCurious .9s ease-in-out; }
#char-crew.mood-curious .eye { transform: scale(1.05); }

/* Faint staircase motif — echoes the logomark, used once, quietly */
.stair-motif {
  position: absolute; width: 260px; height: 260px; opacity: 0.06; pointer-events: none;
  bottom: -40px; left: -40px; transform: rotate(-6deg);
}
body[data-theme="dark"] .stair-motif { opacity: 0.09; }

.theme-toggle-auth {
  position: absolute; top: 20px; right: 20px; z-index: 5;
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(20,21,26,0.12); background: rgba(255,255,255,0.55);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: rgba(20,21,26,0.7);
  box-shadow: var(--shadow-md); transition: transform .15s, color .15s, background .15s;
}
.theme-toggle-auth:hover { color: var(--ink); background: rgba(255,255,255,0.85); transform: translateY(-1px); }
.theme-toggle-auth svg { width: 16px; height: 16px; }
body[data-theme="dark"] .theme-toggle-auth { border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.85); }
body[data-theme="dark"] .theme-toggle-auth:hover { color: #fff; background: rgba(255,255,255,0.18); }

.auth-box { width: 100%; max-width: 400px; position: relative; z-index: 1; animation: authRise .65s cubic-bezier(.16,1,.3,1) both; display: flex; flex-direction: column; align-items: center; }
@keyframes authRise { from { opacity: 0; transform: translateY(18px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }

.auth-logo-wrap { position: relative; margin-bottom: 22px; display: flex; align-items: center; justify-content: center; }
.auth-logo-glow {
  position: absolute; width: 180px; height: 90px; border-radius: 50%; filter: blur(30px); opacity: 0.55;
  background: var(--brand-gradient);
}
.auth-logo { position: relative; height: 46px; width: auto; display: block; filter: drop-shadow(0 6px 18px rgba(140,30,110,0.20)); }

.auth-panel {
  width: 100%;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px) saturate(140%);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 26px; padding: 34px 28px 26px;
  box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
}
body[data-theme="dark"] .auth-panel { background: rgba(24,19,28,0.88); border-color: rgba(255,255,255,0.08); }
.auth-panel::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--brand-gradient);
}

.auth-header { text-align: center; margin-bottom: 22px; }
.auth-header h1 { font-family: 'Poppins','Inter',sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
.auth-header p  { font-size: 13px; color: var(--text-light); margin-top: 6px; line-height: 1.5; }

.auth-role-toggle { display: flex; gap: 8px; margin-bottom: 20px; background: rgba(20,21,26,0.05); padding: 4px; border-radius: 13px; }
body[data-theme="dark"] .auth-role-toggle { background: rgba(255,255,255,0.06); }
.role-tab {
  flex: 1; padding: 9px 8px; border-radius: 10px; border: none;
  background: transparent; color: var(--text-light); font-size: 12.5px; font-weight: 700;
  cursor: pointer; transition: background .15s, color .15s, box-shadow .15s; text-align: center;
}
.role-tab.active { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px -2px rgba(20,21,26,0.18); }
.role-tab.active::before { content: ''; }

.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-light); margin-bottom: 7px; }
.field-group { margin-bottom: 14px; }

input, select {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 14.5px; padding: 11px 13px; outline: none; width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(239,110,92,0.15); }
input::placeholder { color: var(--text-faint); }
input[type=password] { letter-spacing: 0.12em; }

.error-msg { font-size: 13px; color: var(--red); margin: 4px 0 8px; text-align: center; animation: shake .35s ease; }
@keyframes shake {
  10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); }
  30%, 50%, 70% { transform: translateX(-4px); } 40%, 60% { transform: translateX(4px); }
}

.btn-auth {
  width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  position: relative; overflow: hidden; padding: 13px 16px; margin-top: 6px;
  background: var(--brand-gradient); background-size: 160% 160%;
  color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 0.01em;
  border: none; border-radius: 13px; cursor: pointer;
  transition: transform .1s, box-shadow .18s, background-position .4s ease;
  box-shadow: 0 10px 22px -8px rgba(209,26,179,0.45);
}
.btn-auth:hover { background-position: 100% 0; box-shadow: 0 14px 28px -8px rgba(209,26,179,0.55); }
.btn-auth:active { transform: scale(0.97); }
.btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.btn-auth .arrow { transition: transform .18s; }
.btn-auth:hover .arrow { transform: translateX(3px); }

.auth-footnote { text-align: center; font-size: 11.5px; color: var(--text-faint); margin-top: 18px; }

/* ── Success state (shown after a valid PIN) ── */
.success-icon {
  width: 54px; height: 54px; border-radius: 50%; background: var(--brand-gradient);
  display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  box-shadow: 0 10px 24px -8px rgba(209,26,179,0.5);
}
.success-icon svg { width: 24px; height: 24px; stroke: #fff; }
.success-role { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--brand-2); text-align: center; margin-bottom: 4px; }
.success-name { font-family: 'Poppins','Inter',sans-serif; font-size: 18px; font-weight: 700; text-align: center; color: var(--ink); margin-bottom: 18px; }
.btn-secondary {
  width: 100%; padding: 11px 16px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--card); color: var(--text-light); font-size: 13px; font-weight: 600; cursor: pointer;
  transition: color .15s, border-color .15s;
}
.btn-secondary:hover { color: var(--text); border-color: var(--brand-2); }

.hidden { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  .auth-blob, .auth-panel::before, .auth-box,
  .char, #char-crew.mood-happy .char, #char-crew.mood-sad .char, #char-crew.mood-curious .char {
    animation: none !important;
  }
}

@media (min-width: 480px) {
  .auth-box { max-width: 420px; }
  .auth-panel { padding: 40px 36px 30px; }
  .auth-header h1 { font-size: 22px; }
}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════
   FACE Prep Campus — standalone login page
   Drop this file into your project. It queries the same
   `college_contacts` table as the main dashboard, so KAM and
   Campus Manager logins stay in sync with one source of truth.

   To integrate: replace handleLoginSuccess() below with
   whatever you use to route into the rest of your app
   (e.g. show your platform-select screen), instead of the
   built-in success panel used for this demo.
   ═══════════════════════════════════════════════════════════ */

const SUPABASE_URL      = 'https://rysajbwcuieovbsllaas.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5c2FqYndjdWllb3Zic2xsYWFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NjI3MjgsImV4cCI6MjA5NjAzODcyOH0.2WenjYKsfQYAeUJxVJcEVQwqYUlfwrYltrMuC9Ggu4A';
const ADMIN_PIN = '1212'; // Master Admin PIN — change this for production
let sb = null;
try{
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(e){
  console.error('Supabase client failed to load (check the CDN script tag / network):', e);
}

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
function escHTML(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let authRole = 'kam';
let collegeContacts = [];

/* ── Theme ── */
function applyThemeIcon(){
  const dark = document.body.getAttribute('data-theme') === 'dark';
  const paths = dark
    ? '<path d="M13.5 9.3A5.8 5.8 0 0 1 6.7 2.5 5.8 5.8 0 1 0 13.5 9.3z"/>'
    : '<circle cx="8" cy="8" r="3.2"/><path d="M8 1.5v1.4M8 13.1v1.4M2.6 8H1.2M14.8 8h-1.4M3.9 3.9l1 1M11.1 11.1l1 1M11.1 3.9l-1 1M3.9 11.1l1 1"/>';
  $('theme-toggle-icon').innerHTML = paths;
}
function toggleTheme(){
  const cur = document.body.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  document.body.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  applyThemeIcon();
}
applyThemeIcon();

/* ── Character crew: eyes follow the cursor ── */
(function(){
  const crew = $('char-crew');
  if(!crew) return;
  const pupils = crew.querySelectorAll('.pupil');
  let targetX = 0, targetY = 0, curX = 0, curY = 0;
  document.addEventListener('mousemove', e => {
    const w = window.innerWidth, h = window.innerHeight;
    targetX = (e.clientX / w - 0.5) * 2;
    targetY = (e.clientY / h - 0.5) * 2;
  });
  function tick(){
    curX += (targetX - curX) * 0.12;
    curY += (targetY - curY) * 0.12;
    pupils.forEach(p => { p.style.transform = `translate(${curX*3}px, ${curY*2.8}px)`; });
    requestAnimationFrame(tick);
  }
  tick();
})();

/* ── Character crew: occasional blink, per-eye, so it never looks frozen ── */
function startCrewBlinking(){
  const eyes = document.querySelectorAll('#char-crew .eye');
  eyes.forEach(eye => {
    (function loopBlink(){
      const delay = 1800 + Math.random() * 3200;
      setTimeout(() => {
        eye.classList.add('blink');
        setTimeout(() => eye.classList.remove('blink'), 130);
        loopBlink();
      }, delay);
    })();
  });
}
startCrewBlinking();

/* ── Character crew: mood engine ──
   'happy' on a correct PIN, 'sad' on a wrong PIN / missing field,
   'curious' when switching KAM ↔ Campus Manager, and it also fires
   quietly on its own every so often so the crew always feels alive. */
let crewMoodTimer = null;
function setCrewMood(mood, duration){
  const crew = $('char-crew');
  if(!crew) return;
  crew.classList.remove('mood-happy','mood-sad','mood-curious');
  void crew.offsetWidth; // restart the CSS animation even if the same mood fires twice in a row
  crew.classList.add('mood-' + mood);
  if(crewMoodTimer) clearTimeout(crewMoodTimer);
  crewMoodTimer = setTimeout(() => { crew.classList.remove('mood-' + mood); }, duration || 1000);
}
(function idleGestureLoop(){
  const delay = 9000 + Math.random() * 9000;
  setTimeout(() => {
    const crew = $('char-crew');
    if(crew && !crew.classList.contains('mood-happy') && !crew.classList.contains('mood-sad')){
      setCrewMood('curious', 900);
    }
    idleGestureLoop();
  }, delay);
})();

/* ── Role tabs ── */
function setAuthRole(role){
  authRole = role;
  $('role-tab-kam').classList.toggle('active', role==='kam');
  $('role-tab-manager').classList.toggle('active', role==='manager');
  $('kam-login-block').classList.toggle('hidden', role!=='kam');
  $('manager-login-block').classList.toggle('hidden', role!=='manager');
  hide('pin-error');
  setCrewMood('curious', 800);
}

/* ── Load colleges / KAMs from Supabase ── */
function populateCollegeDropdown(){
  const sel = $('manager-college-select');
  const names = [...new Set(collegeContacts.map(c => c.college))].sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = names.length
    ? '<option value="" disabled selected>Select your college</option>' +
      names.map(n => `<option value="${escHTML(n)}">${escHTML(n)}</option>`).join('')
    : '<option value="">No colleges configured yet</option>';
}
function buildKamList(){
  const map = {};
  collegeContacts.forEach(c => {
    if(c.senior_manager_name){
      if(!map[c.senior_manager_name]) map[c.senior_manager_name] = { name: c.senior_manager_name, pin: c.senior_manager_pin, colleges: [] };
      map[c.senior_manager_name].colleges.push(c.college);
    }
  });
  return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name));
}
function populateKamDropdown(){
  const sel = $('kam-select');
  const kams = buildKamList();
  sel.innerHTML = '<option value="" disabled selected>Select login</option>' +
    '<option value="__master__">Master Admin (All Colleges)</option>' +
    kams.map(k => `<option value="${escHTML(k.name)}">${escHTML(k.name)}</option>`).join('');
}
async function loadCollegeContacts(){
  populateCollegeDropdown();
  populateKamDropdown();
  if(!sb) return;
  try{
    const { data, error } = await sb.from('college_contacts')
      .select('college,senior_manager_name,senior_manager_pin,campus_manager_name,campus_manager_pin,zone');
    if(error) throw error;
    collegeContacts = data || [];
  }catch(e){
    console.error('Could not load college_contacts:', e);
  }
  populateCollegeDropdown();
  populateKamDropdown();
}
loadCollegeContacts();

/* ── Submit ── */
function submitLogin(){
  if(authRole === 'kam') submitKamLogin();
  else submitManagerLogin();
}
function submitKamLogin(){
  const err = $('pin-error');
  const sel = ($('kam-select').value || '').trim();
  const pin = ($('kam-pin-input').value || '').trim();
  if(!sel){ err.textContent = 'Please select a login.'; show('pin-error'); setCrewMood('sad', 800); return; }
  if(!pin){ err.textContent = 'Enter your PIN.'; show('pin-error'); setCrewMood('sad', 800); return; }
  if(sel === '__master__'){
    if(pin !== ADMIN_PIN){ failPin('kam-pin-input', 'Incorrect PIN.'); return; }
    hide('pin-error');
    handleLoginSuccess({ role: 'admin', name: 'Master Admin', colleges: null });
    return;
  }
  const rec = buildKamList().find(k => k.name === sel);
  if(!rec || !rec.pin || String(rec.pin) !== pin){ failPin('kam-pin-input', 'Incorrect PIN for this KAM.'); return; }
  hide('pin-error');
  handleLoginSuccess({ role: 'kam', name: rec.name, colleges: rec.colleges.slice() });
}
function submitManagerLogin(){
  const err = $('pin-error');
  const college = $('manager-college-select').value;
  const pin = ($('manager-pin-input').value || '').trim();
  if(!college){ err.textContent = 'Select your college.'; show('pin-error'); setCrewMood('sad', 800); return; }
  if(!pin){ err.textContent = 'Enter your PIN.'; show('pin-error'); setCrewMood('sad', 800); return; }
  const rec = collegeContacts.find(c => c.college === college);
  const expected = rec ? rec.campus_manager_pin : null;
  if(!rec || !expected || String(expected) !== pin){ failPin('manager-pin-input', 'Incorrect PIN for this college.'); return; }
  hide('pin-error');
  handleLoginSuccess({ role: 'manager', name: college, colleges: [college] });
}
function failPin(inputId, msg){
  $('pin-error').textContent = msg;
  show('pin-error');
  $(inputId).value = '';
  $(inputId).focus();
  setCrewMood('sad', 1100);
}

/* ── What happens after a valid PIN ──
   Replace the body of this function with your own routing —
   e.g. hide('login-panel'); showPlatformSelect();            */
function handleLoginSuccess(session){
  window.FacePrepSession = session; // { role, name, colleges }
  setCrewMood('happy', 1300);
  setTimeout(() => {
    hide('login-panel');
    const roleLabel = { admin: 'Master Admin', kam: 'KAM', manager: 'Campus Manager' }[session.role];
    $('success-role').textContent = 'Signed in · ' + roleLabel;
    $('success-name').textContent = session.name;
    show('success-panel');
  }, 550);
}
function doLogout(){
  window.FacePrepSession = null;
  $('kam-pin-input').value = '';
  $('manager-pin-input').value = '';
  hide('success-panel');
  hide('pin-error');
  show('login-panel');
  setCrewMood('curious', 700);
}

document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(['manager-pin-input','manager-college-select','kam-pin-input','kam-select'].includes(e.target.id)){
    e.preventDefault();
    submitLogin();
  }
});
</script>
