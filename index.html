<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · FACE Prep Campus Help Desk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ── Brand — sampled from the FACE Prep Campus mark ── */
  --brand-1: #D11AB3;   /* magenta        */
  --brand-2: #EF6E5C;   /* coral          */
  --brand-3: #F6A968;   /* warm orange    */
  --brand-4: #7C5CFC;   /* violet         */
  --brand-5: #E879C6;   /* pink           */
  --brand-gradient: linear-gradient(120deg, var(--brand-1) 0%, var(--brand-2) 55%, var(--brand-3) 100%);

  --page-bg: #EEEFF3;
  --ink: #14151A;
  --text: #14151A;
  --text-light: #5B6270;
  --text-faint: #9199A6;
  --card: #FFFFFF;
  --illustration-bg: #FBF1F1;
  --border: #E7E9EC;
  --red: #DC2626;
  --shadow-card: 0 30px 60px -24px rgba(30,20,40,0.18), 0 10px 24px -12px rgba(30,20,40,0.10);
}

html, body { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  transition: background .25s ease, color .25s ease;
}
button, input, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }

/* ── Page backdrop: quiet and light, so the card reads as its own object ── */
.auth-wrap {
  height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 24px;
  position: relative;
  background: var(--page-bg);
  overflow: hidden;
}

/* ── The card: one object, two zones ── */
.auth-card {
  width: 100%; max-width: 920px;
  max-height: calc(100vh - 40px);
  background: var(--card);
  border-radius: 28px;
  box-shadow: var(--shadow-card);
  display: flex;
  overflow: hidden;
  animation: authRise .6s cubic-bezier(.16,1,.3,1) both;
}
@keyframes authRise { from { opacity: 0; transform: translateY(16px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* ── Left zone: illustration ── */
.auth-card-illustration {
  flex: 0 0 42%;
  background: var(--illustration-bg);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding: 40px 24px 0;
  position: relative;
  min-height: 440px;
  overflow: hidden;
}
@media (max-width: 820px) { .auth-card-illustration { display: none; } }

/* ── Floating bokeh dots — soft, out-of-focus brand-colored lights ── */
.bokeh { position: absolute; border-radius: 50%; pointer-events: none; animation: bokehDrift ease-in-out infinite; }
.bokeh-1 { width: 20px; height: 20px; top: 12%; left: 16%; background: var(--brand-3); opacity: 0.55; animation-duration: 6.5s; filter: blur(2px); }
.bokeh-2 { width: 10px; height: 10px; top: 8%;  left: 60%; background: var(--brand-2); opacity: 0.8;  animation-duration: 5.5s; animation-delay: .4s; filter: blur(0.5px); }
.bokeh-3 { width: 38px; height: 38px; top: 5%;  left: 82%; background: var(--brand-4); opacity: 0.35; animation-duration: 7.2s; animation-delay: .8s; filter: blur(4px); }
.bokeh-4 { width: 13px; height: 13px; top: 25%; left: 79%; background: var(--brand-5); opacity: 0.7;  animation-duration: 6s;   animation-delay: .2s; filter: blur(1px); }
.bokeh-5 { width: 9px;  height: 9px;  top: 30%; left: 39%; background: var(--brand-4); opacity: 0.5;  animation-duration: 5s;   animation-delay: 1s;  filter: blur(0.5px); }
.bokeh-6 { width: 30px; height: 30px; top: 17%; left: 5%;  background: var(--brand-2); opacity: 0.28; animation-duration: 6.8s; animation-delay: .6s; filter: blur(3.5px); }
.bokeh-7 { width: 7px;  height: 7px;  top: 38%; left: 60%; background: var(--brand-3); opacity: 0.65; animation-duration: 5.8s; animation-delay: .3s; filter: blur(0.5px); }
@keyframes bokehDrift {
  0%, 100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-10px) scale(1.06); }
}
@media (prefers-reduced-motion: reduce) { .bokeh { animation: none !important; } }

/* ── Soft glow grounding the scene ── */
.illo-glow {
  position: absolute; left: 50%; bottom: 40px;
  width: 280px; height: 200px; transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(209,26,179,0.16) 0%, rgba(209,26,179,0) 70%);
  pointer-events: none; z-index: 0;
}

.illo-copy { position: relative; z-index: 1; text-align: center; margin-bottom: 18px; padding: 0 8px; }
.illo-copy h2 { font-family: 'Poppins','Inter',sans-serif; font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
.illo-copy p  { font-size: 13px; color: var(--text-light); margin-top: 6px; line-height: 1.5; }

.illo-scene {
  position: relative;
  z-index: 1;
  width: 232px;
  margin-bottom: 48px;
  pointer-events: none;
  animation: illoFloat 4s ease-in-out infinite;
  transform-origin: bottom center;
}
.illo-svg { width: 100%; height: auto; display: block; }
@keyframes illoFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}

@keyframes illoHappyJump {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  30%      { transform: translateY(-14px) rotate(-3deg); }
  55%      { transform: translateY(2px) rotate(2deg); }
  78%      { transform: translateY(-6px) rotate(-1deg); }
}
@keyframes illoSadShake {
  0%, 100% { transform: translateY(2px) rotate(0deg); }
  20%      { transform: translateY(2px) rotate(-3deg); }
  40%      { transform: translateY(2px) rotate(3deg); }
  60%      { transform: translateY(4px) rotate(-2deg); }
  80%      { transform: translateY(4px) rotate(2deg); }
}
@keyframes illoCurious {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  50%      { transform: rotate(-3deg) translateY(-4px); }
}
#illo-scene.mood-happy  { animation: illoHappyJump .7s ease-in-out; }
#illo-scene.mood-sad    { animation: illoSadShake .6s ease-in-out; }
#illo-scene.mood-curious{ animation: illoCurious .9s ease-in-out; }

@media (prefers-reduced-motion: reduce) {
  .auth-card, .illo-scene, #illo-scene.mood-happy, #illo-scene.mood-sad, #illo-scene.mood-curious {
    animation: none !important;
  }
}

/* ── Right zone: the form ── */
.auth-card-form {
  flex: 1 1 58%;
  background: var(--card);
  padding: 40px 52px;
  display: flex; flex-direction: column; justify-content: center;
  max-height: calc(100vh - 40px);
  overflow-y: auto;
}
@media (max-width: 820px) { .auth-card-form { flex: 1 1 100%; padding: 36px 28px; } }

.auth-logo-wrap {
  display: flex; justify-content: center; margin-bottom: 30px;
  animation: logoRise .7s cubic-bezier(.16,1,.3,1) both;
  animation-delay: .1s;
}
.auth-logo {
  height: 62px; width: auto; display: block;
  filter: drop-shadow(0 8px 16px rgba(209,26,179,0.18));
  transition: transform .25s ease, filter .25s ease;
}
.auth-logo-wrap:hover .auth-logo {
  transform: translateY(-2px) scale(1.02);
  filter: drop-shadow(0 10px 20px rgba(209,26,179,0.26));
}
@keyframes logoRise {
  from { opacity: 0; transform: translateY(-8px) scale(0.94); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .auth-logo-wrap { animation: none !important; }
  .auth-logo { transition: none !important; }
}

.auth-header { text-align: center; margin-bottom: 26px; }
.auth-header h1 { font-family: 'Poppins','Inter',sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
.auth-header p  { font-size: 13.5px; color: var(--text-light); margin-top: 7px; line-height: 1.5; }

.auth-form-inner { max-width: 340px; width: 100%; margin: 0 auto; }

.auth-role-toggle { display: flex; gap: 8px; margin-bottom: 22px; background: rgba(20,21,26,0.05); padding: 4px; border-radius: 13px; }
.role-tab {
  flex: 1; padding: 9px 8px; border-radius: 10px; border: none;
  background: transparent; color: var(--text-light); font-size: 12.5px; font-weight: 700;
  cursor: pointer; transition: background .15s, color .15s, box-shadow .15s; text-align: center;
}
.role-tab.active { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px -2px rgba(20,21,26,0.18); }

.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-light); margin-bottom: 7px; }
.field-group { margin-bottom: 14px; }

input, select {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 14.5px; padding: 11px 13px; outline: none; width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(239,110,92,0.15); }
input::placeholder { color: var(--text-faint); }
input[type=password] { letter-spacing: 0.12em; }

.error-msg { font-size: 13px; color: var(--red); margin: 4px 0 8px; text-align: center; animation: shake .35s ease; }
@keyframes shake {
  10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); }
  30%, 50%, 70% { transform: translateX(-4px); } 40%, 60% { transform: translateX(4px); }
}

.btn-auth {
  width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  position: relative; overflow: hidden; padding: 13px 16px; margin-top: 6px;
  background: var(--brand-gradient); background-size: 160% 160%;
  color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 0.01em;
  border: none; border-radius: 13px; cursor: pointer;
  transition: transform .1s, box-shadow .18s, background-position .4s ease;
  box-shadow: 0 10px 22px -8px rgba(209,26,179,0.40);
}
.btn-auth:hover { background-position: 100% 0; box-shadow: 0 14px 28px -8px rgba(209,26,179,0.5); }
.btn-auth:active { transform: scale(0.97); }
.btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.btn-auth .arrow { transition: transform .18s; }
.btn-auth:hover .arrow { transform: translateX(3px); }

.auth-footnote { text-align: center; font-size: 11.5px; color: var(--text-faint); margin-top: 20px; }

.success-icon {
  width: 54px; height: 54px; border-radius: 50%; background: var(--brand-gradient);
  display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  box-shadow: 0 10px 24px -8px rgba(209,26,179,0.5);
}
.success-icon svg { width: 24px; height: 24px; stroke: #fff; }
.success-role { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--brand-2); text-align: center; margin-bottom: 4px; }
.success-name { font-family: 'Poppins','Inter',sans-serif; font-size: 18px; font-weight: 700; text-align: center; color: var(--ink); margin-bottom: 18px; }
.btn-secondary {
  width: 100%; padding: 11px 16px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--card); color: var(--text-light); font-size: 13px; font-weight: 600; cursor: pointer;
  transition: color .15s, border-color .15s;
}
.btn-secondary:hover { color: var(--text); border-color: var(--brand-2); }

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card-illustration">
      <span class="bokeh bokeh-1" aria-hidden="true"></span>
      <span class="bokeh bokeh-2" aria-hidden="true"></span>
      <span class="bokeh bokeh-3" aria-hidden="true"></span>
      <span class="bokeh bokeh-4" aria-hidden="true"></span>
      <span class="bokeh bokeh-5" aria-hidden="true"></span>
      <span class="bokeh bokeh-6" aria-hidden="true"></span>
      <span class="bokeh bokeh-7" aria-hidden="true"></span>

      <div class="illo-glow" aria-hidden="true"></div>

      <div class="illo-copy">
        <h2>Welcome back</h2>
        <p>Manage tickets in one place</p>
      </div>

      <div class="illo-scene" id="illo-scene" aria-hidden="true">
        <svg class="illo-svg" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#E11FBE"/>

            </linearGradient>
            <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#8A6BFF"/>

            <linearGradient id="bubbleGrad" x1="0" y1="0" x2="1" y2="1">

            </linearGradient>
          </defs>

          <ellipse cx="115" cy="196" rx="82" ry="8" fill="#14151A" opacity="0.08"/>

          <!-- small potted plant for scene depth -->
          <g>
            <rect x="10" y="176" width="20" height="18" rx="3" fill="#EF6E5C" opacity="0.9"/>
            <path d="M20 176c-8-6-10-16-2-22 2 8 2 16 2 22z" fill="#7C5CFC"/>
            <path d="M20 176c8-4 12-14 6-21-4 7-6 15-6 21z" fill="#8A6BFF"/>
            <path d="M20 176c-2-9 2-18 8-22-1 8-3 16-8 22z" fill="#6F4CF0"/>
          </g>

          <!-- house -->
          <g>
            <polygon points="72,58 22,96 122,96" fill="url(#roofGrad)"/>
            <rect x="65" y="66" width="14" height="12" rx="2" fill="#F6A968"/>
            <rect x="30" y="96" width="84" height="70" rx="5" fill="url(#wallGrad)"/>
            <rect x="30" y="96" width="84" height="13" fill="#EF6E5C"/>
            <rect x="40" y="119" width="16" height="18" rx="2" fill="#fff" opacity="0.92"/>
            <rect x="64" y="119" width="16" height="18" rx="2" fill="#fff" opacity="0.92"/>
            <rect x="88" y="119" width="16" height="18" rx="2" fill="#fff" opacity="0.92"/>
            <rect x="40" y="142" width="16" height="18" rx="2" fill="#fff" opacity="0.92"/>
            <rect x="64" y="142" width="16" height="18" rx="2" fill="#fff" opacity="0.92"/>
            <rect x="88" y="142" width="16" height="18" rx="2" fill="#fff" opacity="0.92"/>
          </g>

          <!-- chat bubble -->
          <g>
            <path d="M142 62h60a12 12 0 0 1 12 12v26a12 12 0 0 1-12 12h-36l-18 16v-16h-6a12 12 0 0 1-12-12V74a12 12 0 0 1 12-12z" fill="url(#bubbleGrad)"/>
            <rect x="156" y="82" width="42" height="5" rx="2.5" fill="#fff" opacity="0.9"/>
            <rect x="156" y="93" width="28" height="5" rx="2.5" fill="#fff" opacity="0.65"/>
          </g>

          <!-- notepad card -->
          <g>
            <rect x="114" y="112" width="58" height="80" rx="10" fill="#fff" stroke="#D11AB3" stroke-width="3"/>
            <rect x="114" y="112" width="58" height="16" rx="10" fill="#D11AB3"/>
            <rect x="124" y="140" width="30" height="4.5" rx="2.25" fill="#EF6E5C"/>
            <rect x="124" y="150" width="38" height="4.5" rx="2.25" fill="#F6A968"/>
            <rect x="124" y="160" width="22" height="4.5" rx="2.25" fill="#7C5CFC"/>
            <rect x="124" y="170" width="34" height="4.5" rx="2.25" fill="#EF6E5C"/>
          </g>

          <!-- checkmark badge -->
          <g>
            <circle cx="182" cy="192" r="21" fill="#F6A968"/>
            <path d="M172 192l7 7 13-13" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="auth-card-form">
      <div class="auth-form-inner">
        <div class="auth-logo-wrap">
          <img class="auth-logo" src="Face prep logo3.png" alt="FACE Prep Campus" />
        </div>

        <!-- ── LOGIN PANEL ── -->
        <div id="login-panel">
          <div class="auth-header">
            <h1>Campus Help Desk</h1>
            <p>Sign in to manage tickets &amp; daily activity logs.</p>
          </div>

          <div class="auth-role-toggle">
            <button type="button" class="role-tab active" id="role-tab-kam" onclick="setAuthRole('kam')">KAM</button>
            <button type="button" class="role-tab" id="role-tab-manager" onclick="setAuthRole('manager')">Campus Manager</button>
          </div>

          <div id="kam-login-block">
            <div class="field-group">
              <label class="field-label">Login as</label>
              <select id="kam-select"></select>
            </div>
            <div class="field-group">
              <label class="field-label">PIN</label>
              <input id="kam-pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="Enter your PIN" />

          </div>

          <div id="manager-login-block" class="hidden">

              <label class="field-label">College</label>

            <div class="field-group">
              <label class="field-label">Manager PIN</label>
              <input id="manager-pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="Enter your PIN" />
            </div>
          </div>

          <div id="pin-error" class="error-msg hidden"></div>

          <button class="btn-auth" id="submit-btn" onclick="submitLogin()">

          </button>
        </div>

        <!-- ── SUCCESS PANEL ── -->
        <div class="hidden" id="success-panel">
          <div class="success-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg></div>
          <div class="success-role" id="success-role">Signed in</div>
          <div class="success-name" id="success-name">—</div>
          <button class="btn-secondary" onclick="doLogout()">Log out</button>
        </div>

        <div class="auth-footnote">Authorized personnel only · FACE Prep Campus</div>
      </div>
    </div>
  </div>

<script>
/* ═══════════════════════════════════════════════════════════
   FACE Prep Campus — standalone login page
   Drop this file into your project. It queries the same
   `college_contacts` table as the main dashboard, so KAM and
   Campus Manager logins stay in sync with one source of truth.

   To integrate: replace handleLoginSuccess() below with
   whatever you use to route into the rest of your app.
   ═══════════════════════════════════════════════════════════ */

const SUPABASE_URL      = 'https://rysajbwcuieovbsllaas.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5c2FqYndjdWllb3Zic2xsYWFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NjI3MjgsImV4cCI6MjA5NjAzODcyOH0.2WenjYKsfQYAeUJxVJcEVQwqYUlfwrYltrMuC9Ggu4A';
const ADMIN_PIN = '1212'; // Master Admin PIN — change this for production
let sb = null;
try{
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(e){
  console.error('Supabase client failed to load (check the CDN script tag / network):', e);
}

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
function escHTML(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let authRole = 'kam';
let collegeContacts = [];

/* ── Illustration: mood engine (bounce/shake/tilt on login events) ── */
let crewMoodTimer = null;
function setCrewMood(mood, duration){
  const scene = $('illo-scene');
  if(!scene) return;
  scene.classList.remove('mood-happy','mood-sad','mood-curious');
  void scene.offsetWidth;
  scene.classList.add('mood-' + mood);
  if(crewMoodTimer) clearTimeout(crewMoodTimer);
  crewMoodTimer = setTimeout(() => { scene.classList.remove('mood-' + mood); }, duration || 1000);
}
(function idleGestureLoop(){
  const delay = 9000 + Math.random() * 9000;
  setTimeout(() => {
    const scene = $('illo-scene');
    if(scene && !scene.classList.contains('mood-happy') && !scene.classList.contains('mood-sad')){
      setCrewMood('curious', 900);
    }
    idleGestureLoop();
  }, delay);
})();

/* ── Role tabs ── */
function setAuthRole(role){
  authRole = role;
  $('role-tab-kam').classList.toggle('active', role==='kam');
  $('role-tab-manager').classList.toggle('active', role==='manager');
  $('kam-login-block').classList.toggle('hidden', role!=='kam');
  $('manager-login-block').classList.toggle('hidden', role!=='manager');
  hide('pin-error');
  setCrewMood('curious', 800);
}

/* ── Load colleges / KAMs from Supabase ── */
function populateCollegeDropdown(){
  const sel = $('manager-college-select');
  const names = [...new Set(collegeContacts.map(c => c.college))].sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = names.length
    ? '<option value="" disabled selected>Select your college</option>' +
      names.map(n => `<option value="${escHTML(n)}">${escHTML(n)}</option>`).join('')
    : '<option value="">No colleges configured yet</option>';
}
function buildKamList(){
  const map = {};
  collegeContacts.forEach(c => {
    if(c.senior_manager_name){
      if(!map[c.senior_manager_name]) map[c.senior_manager_name] = { name: c.senior_manager_name, pin: c.senior_manager_pin, colleges: [] };
      map[c.senior_manager_name].colleges.push(c.college);
    }
  });
  return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name));
}
function populateKamDropdown(){
  const sel = $('kam-select');
  const kams = buildKamList();
  sel.innerHTML = '<option value="" disabled selected>Select login</option>' +
    '<option value="__master__">Master Admin (All Colleges)</option>' +
    kams.map(k => `<option value="${escHTML(k.name)}">${escHTML(k.name)}</option>`).join('');
}
async function loadCollegeContacts(){
  populateCollegeDropdown();
  populateKamDropdown();
  if(!sb) return;
  try{
    const { data, error } = await sb.from('college_contacts')
      .select('college,senior_manager_name,senior_manager_pin,campus_manager_name,campus_manager_pin,zone');
    if(error) throw error;
    collegeContacts = data || [];
  }catch(e){
    console.error('Could not load college_contacts:', e);
  }
  populateCollegeDropdown();
  populateKamDropdown();
}
loadCollegeContacts();

/* ── Submit ── */
function submitLogin(){
  if(authRole === 'kam') submitKamLogin();
  else submitManagerLogin();
}
function submitKamLogin(){
  const err = $('pin-error');
  const sel = ($('kam-select').value || '').trim();
  const pin = ($('kam-pin-input').value || '').trim();
  if(!sel){ err.textContent = 'Please select a login.'; show('pin-error'); setCrewMood('sad', 800); return; }
  if(!pin){ err.textContent = 'Enter your PIN.'; show('pin-error'); setCrewMood('sad', 800); return; }
  if(sel === '__master__'){
    if(pin !== ADMIN_PIN){ failPin('kam-pin-input', 'Incorrect PIN.'); return; }
    hide('pin-error');
    handleLoginSuccess({ role: 'admin', name: 'Master Admin', colleges: null });
    return;
  }
  const rec = buildKamList().find(k => k.name === sel);
  if(!rec || !rec.pin || String(rec.pin) !== pin){ failPin('kam-pin-input', 'Incorrect PIN for this KAM.'); return; }
  hide('pin-error');
  handleLoginSuccess({ role: 'kam', name: rec.name, colleges: rec.colleges.slice() });
}
function submitManagerLogin(){
  const err = $('pin-error');
  const college = $('manager-college-select').value;
  const pin = ($('manager-pin-input').value || '').trim();
  if(!college){ err.textContent = 'Select your college.'; show('pin-error'); setCrewMood('sad', 800); return; }
  if(!pin){ err.textContent = 'Enter your PIN.'; show('pin-error'); setCrewMood('sad', 800); return; }
  const rec = collegeContacts.find(c => c.college === college);
  const expected = rec ? rec.campus_manager_pin : null;
  if(!rec || !expected || String(expected) !== pin){ failPin('manager-pin-input', 'Incorrect PIN for this college.'); return; }
  hide('pin-error');
  handleLoginSuccess({ role: 'manager', name: college, colleges: [college] });
}
function failPin(inputId, msg){
  $('pin-error').textContent = msg;
  show('pin-error');
  $(inputId).value = '';
  $(inputId).focus();
  setCrewMood('sad', 1100);
}

/* ── What happens after a valid PIN ── */
function handleLoginSuccess(session){
  window.FacePrepSession = session;
  setCrewMood('happy', 1300);
  setTimeout(() => {
    hide('login-panel');
    const roleLabel = { admin: 'Master Admin', kam: 'KAM', manager: 'Campus Manager' }[session.role];
    $('success-role').textContent = 'Signed in · ' + roleLabel;
    $('success-name').textContent = session.name;
    show('success-panel');
  }, 550);
}
function doLogout(){
  window.FacePrepSession = null;
  $('kam-pin-input').value = '';
  $('manager-pin-input').value = '';
  hide('success-panel');
  hide('pin-error');
  show('login-panel');
  setCrewMood('curious', 700);
}

document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(['manager-pin-input','manager-college-select','kam-pin-input','kam-select'].includes(e.target.id)){
    e.preventDefault();
    submitLogin();
  }
});
</script>
</body>
