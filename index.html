<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#eef1fa;
    --panel:#ffffff;
    --panel-2:#f5f7fc;
    --border:#e6e9f4;
    --text:#1b1f2e;
    --muted:#7a8096;
    --accent:#6c5ce7;
    --accent-dim:#e7e3fb;
    --pending:#f59e0b;
    --pending-dim:#fef2dc;
    --progress:#2f6fd6;
    --progress-dim:#e4edfb;
    --success:#1f9d63;
    --success-dim:#e2f5eb;
    --danger:#ef4444;
    --danger-dim:#fde8e8;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}
  h1,h2,h3,.eyebrow,.side-label{font-family:'Plus Jakarta Sans',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d7dcec;border-radius:8px;}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh;}
  @media(max-width:900px){.shell{flex-direction:column;}.sidebar{width:100%!important;height:auto;}}

  /* ---------- Sidebar ---------- */
  .sidebar{width:260px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:18px 16px;display:flex;flex-direction:column;gap:16px;}
  .sidebar-search{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:20px;padding:8px 14px;}
  .sidebar-search input{border:none;background:transparent;outline:none;font-size:13px;color:var(--text);width:100%;font-family:inherit;}
  .sidebar-search .search-icon{font-size:12px;opacity:.55;}

  .side-section{display:flex;align-items:center;justify-content:space-between;padding:0 2px;margin-top:4px;}
  .side-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;}
  .icon-btn{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);}

  .all-toggle{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;font-weight:600;color:var(--muted);text-align:left;background:var(--panel-2);}
  .all-toggle.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}

  .roster-scroll{display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;}
  .member-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px;background:var(--panel-2);cursor:pointer;transition:border-color .15s;position:relative;}
  .member-card:hover{border-color:#c9cee6;}
  .member-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-dim) inset;background:#fff;}
  .member-top{display:flex;align-items:center;gap:9px;}
  .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#12161d;flex-shrink:0;}
  .member-name{font-weight:600;font-size:13px;}
  .member-role{font-size:10.5px;color:var(--muted);}
  .member-del{position:absolute;top:8px;right:8px;font-size:11px;color:var(--muted);opacity:0;transition:opacity .15s;}
  .member-card:hover .member-del{opacity:1;}
  .member-del:hover{color:var(--danger);}
  .mbar-track{height:4px;border-radius:4px;background:var(--border);margin-top:9px;overflow:hidden;}
  .mbar-fill{height:100%;background:linear-gradient(90deg,var(--success),#7fd6a4);}
  .member-stats{display:flex;justify-content:space-between;margin-top:5px;font-size:10.5px;color:var(--muted);}
  .member-stats b{color:var(--text);font-weight:600;}

  .add-member-row{display:flex;gap:6px;}
  .add-member-row input{flex:1;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;}
  .add-member-row input:focus{outline:none;border-color:var(--accent);}
  .add-member-row button{background:var(--accent);border:none;border-radius:8px;padding:0 12px;color:#fff;font-weight:600;font-size:13px;}

  /* ---------- Main column ---------- */
  .main-col{flex:1;display:flex;flex-direction:column;min-width:0;}

  .topbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 26px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#ffffff,#f9fafd);}
  .sync-indicator{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);border-radius:18px;padding:5px 11px 5px 9px;}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--danger);flex-shrink:0;}
  .sync-indicator.ok .sync-dot{background:var(--success);}
  .sync-indicator.ok{color:var(--success);border-color:#bfe6d2;background:var(--success-dim);}
  .sync-indicator.syncing .sync-dot{background:var(--pending);animation:pulse 1s infinite;}
  .sync-indicator.syncing{color:var(--pending);border-color:#fbe3ae;background:var(--pending-dim);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .date-chip{font-family:'JetBrains Mono';font-size:10.5px;color:var(--muted);text-align:right;line-height:1.3;padding-left:10px;border-left:1px solid var(--border);}
  .date-chip .day{color:var(--text);font-weight:500;}

  main{padding:22px 28px 60px;flex:1;display:flex;flex-direction:column;min-height:0;}

  .hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .hero-row h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;}
  .hero-sub{margin:4px 0 0;font-size:13px;color:var(--muted);}
  .primary-btn{background:var(--accent);border:none;color:#fff;font-weight:700;padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:0 6px 14px -6px rgba(108,92,231,.55);}
  .primary-btn:hover{filter:brightness(1.06);}

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  @media(max-width:700px){.stats-row{grid-template-columns:repeat(2,1fr);}}
  .stat{border:1px solid var(--border);background:var(--panel);border-radius:var(--radius);padding:14px 16px;}
  .stat .num{font-family:'Plus Jakarta Sans';font-size:26px;font-weight:800;line-height:1;}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:6px;font-weight:600;}
  .stat.overdue .num{color:var(--danger);}
  .stat.progress .num{color:var(--progress);}
  .stat.done .num{color:var(--success);}
  .stat.pending .num{color:var(--pending);}

  /* ---------- Board ---------- */
  .board{display:flex;gap:16px;align-items:flex-start;flex:1;overflow-x:auto;padding-bottom:8px;}
  .column{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);width:300px;flex-shrink:0;display:flex;flex-direction:column;max-height:100%;}
  .column-head{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;}
  .col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .col-dot.pending{background:var(--pending);}
  .col-dot.in_progress{background:var(--progress);}
  .col-dot.completed{background:var(--success);}
  .column-head .col-title{font-weight:700;font-size:14px;font-family:'Plus Jakarta Sans';}
  .col-count{font-size:11px;font-weight:700;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:1px 8px;color:var(--muted);}
  .column-head .icon-btn{margin-left:auto;}
  .column-body{display:flex;flex-direction:column;gap:10px;padding:0 12px 14px;overflow-y:auto;}

  .k-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;}
  .k-card.overdue{border-color:#f3c6c6;background:#fffafa;}
  .k-card-top{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
  .k-status-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .k-status-label.pending{color:var(--pending);}
  .k-status-label.in_progress{color:var(--progress);}
  .k-status-label.completed{color:var(--success);}
  .k-card-title{font-size:14px;font-weight:700;margin:4px 0 3px;line-height:1.3;}
  .k-card-desc{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 10px;}
  .k-card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .k-due{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono';}
  .k-avatar{width:22px;height:22px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;color:#12161d;font-weight:700;flex-shrink:0;}
  .k-gauge{margin-top:9px;height:4px;border-radius:4px;background:var(--border);overflow:hidden;position:relative;}
  .k-gauge-fill{height:100%;background:linear-gradient(90deg,var(--progress),#8fd0ff);}
  .k-gauge-fill.done{background:linear-gradient(90deg,var(--success),#8fe6b7);}
  .k-gauge-fill.warn{background:linear-gradient(90deg,var(--pending),#ffcf80);}
  .k-gauge-fill.late{background:linear-gradient(90deg,var(--danger),#ff8a8f);}
  .k-gauge-label{margin-top:5px;font-size:10px;color:var(--muted);font-family:'JetBrains Mono';}
  .k-gauge-label.late{color:var(--danger);}
  .k-gauge-label.done{color:var(--success);}
  .k-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .k-actions button{border:1px solid var(--border);background:var(--panel-2);color:var(--muted);border-radius:7px;padding:4px 8px;font-size:10.5px;font-weight:600;}
  .k-actions button:hover{color:var(--text);border-color:#c9cee6;}
  .k-actions button.danger:hover{color:var(--danger);border-color:#f3c6c6;}

  .empty-col{border:1px dashed var(--border);border-radius:var(--radius-sm);padding:22px 12px;text-align:center;color:var(--muted);font-size:12px;margin:0 12px 14px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,22,35,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px;font-size:19px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px;font-weight:700;font-family:'Plus Jakarta Sans';}
  .field input,.field textarea,.field select{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--muted);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;}
  .btn-secondary:hover{color:var(--text);}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-search">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search tasks...">
    </div>
    <div class="side-section">
      <span class="side-label">Team</span>
      <button class="icon-btn" id="addMemberBtn" title="Add member">+</button>
    </div>
    <button class="all-toggle active" id="allMembersBtn">All members</button>
    <div class="roster-scroll" id="rosterList"></div>
    <div class="add-member-row" id="addMemberRow" style="display:none;">
      <input type="text" id="newMemberName" placeholder="Name">
      <button id="confirmAddMember">Add</button>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <button class="icon-btn" id="refreshBtn" title="Refresh">⟳</button>
      <div id="syncIndicator" class="sync-indicator" title="Sync status">
        <span class="sync-dot"></span><span id="syncLabel">Connecting…</span>
      </div>
      <div class="date-chip">
        <div class="day" id="clockDay">—</div>
        <div id="clockTime">—</div>
      </div>
    </div>

    <main>
      <div class="hero-row">
        <div>
          <h1>Operations Team</h1>
          <p class="hero-sub">Daily task tracker — stay organized, complete tasks, hit deadlines.</p>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn-secondary" id="exportCompletedBtn" title="Export all tasks to Excel">⬇ Export tasks (.xlsx)</button>
          <button class="primary-btn" id="addTaskBtn">+ Assign task</button>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat pending"><div class="num" id="statPending">0</div><div class="lbl">Pending</div></div>
        <div class="stat progress"><div class="num" id="statProgress">0</div><div class="lbl">In progress</div></div>
        <div class="stat done"><div class="num" id="statDone">0</div><div class="lbl">Completed</div></div>
        <div class="stat overdue"><div class="num" id="statOverdue">0</div><div class="lbl">Overdue</div></div>
      </div>

      <div class="board" id="board"></div>
    </main>
  </div>
</div>

<!-- Task Modal -->
<div class="overlay" id="taskOverlay">
  <div class="modal">
    <h3 id="taskModalTitle">Assign a task</h3>
    <input type="hidden" id="taskId">
    <div class="field">
      <label>Task title</label>
      <input type="text" id="taskTitle" placeholder="e.g. Reconcile shipment manifests">
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="taskDesc" placeholder="Details, links, or instructions..."></textarea>
    </div>
    <div class="field">
      <label>Assign to</label>
      <select id="taskMember"></select>
    </div>
    <div class="row2">
      <div class="field">
        <label>Start</label>
        <input type="datetime-local" id="taskStart">
      </div>
      <div class="field">
        <label>Due by</label>
        <input type="datetime-local" id="taskEnd">
      </div>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="taskStatus">
        <option value="pending">Pending</option>
        <option value="in_progress">In progress</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelTaskBtn">Cancel</button>
      <button class="primary-btn" id="saveTaskBtn">Save task</button>
    </div>
  </div>
</div>


<script>
(function(){
  const AVATAR_COLORS = ['#fbbf24','#60a5fa','#34d399','#f87171','#c084fc','#22d3ee','#fb923c','#a3e635'];
  const COLUMN_DEFS = [
    { status: 'pending', title: 'To Do' },
    { status: 'in_progress', title: 'In Progress' },
    { status: 'completed', title: 'Completed' }
  ];

  // ---------- Supabase connection ----------
  const SUPABASE_PROJECT_ID = 'rfzhifhvtopdayhaiuct';
  const SUPABASE_URL = `https://${SUPABASE_PROJECT_ID}.supabase.co`;
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmemhpZmh2dG9wZGF5aGFpdWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODEyNzYsImV4cCI6MjEwMDQ1NzI3Nn0.X3vTyKA0f--0lQ4_CreXDAMVSHcvOBiWxFAVi2sGHmw';

  let supabase = null;
  let state = { members: [], tasks: [] };
  let currentMemberFilter = null; // null = all
  let searchTerm = '';

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  function setSyncStatus(mode, label){
    const el = $('#syncIndicator');
    el.className = 'sync-indicator' + (mode ? ' ' + mode : '');
    $('#syncLabel').textContent = label;
  }

  function initClient(){
    if(typeof window.supabase === 'undefined'){
      setSyncStatus('', 'Supabase library failed to load');
      return false;
    }
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return true;
  }

  async function loadData(){
    setSyncStatus('syncing', 'Syncing…');
    try{
      const [{ data: members, error: mErr }, { data: tasks, error: tErr }] = await Promise.all([
        supabase.from('members').select('*').order('name'),
        supabase.from('tasks').select('*')
      ]);
      if(mErr) throw mErr;
      if(tErr) throw tErr;
      state = { members: members || [], tasks: tasks || [] };
      setSyncStatus('ok', 'Synced with Supabase');
      return true;
    }catch(e){
      console.error('Supabase load failed', e);
      const hint = /relation .* does not exist/i.test(e.message||'') ? ' — run setup SQL' : '';
      setSyncStatus('', 'Sync failed' + hint);
      return false;
    }
  }

  function subscribeRealtime(){
    supabase
      .channel('ops-board-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, async () => { await loadData(); renderAll(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, async () => { await loadData(); renderAll(); })
      .subscribe();
  }

  function memberById(id){ return state.members.find(m => m.id === id); }

  // ---------- Clock ----------
  function tickClock(){
    const now = new Date();
    $('#clockDay').textContent = now.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
    $('#clockTime').textContent = now.toLocaleTimeString();
  }

  // ---------- Rendering ----------
  function fmtDuration(ms){
    const abs = Math.abs(ms);
    const h = Math.floor(abs/3600000);
    const m = Math.floor((abs%3600000)/60000);
    if(h === 0) return m + 'm';
    return h + 'h ' + m + 'm';
  }

  function taskProgressInfo(task){
    const now = new Date();
    const start = new Date(task.start_time);
    const end = new Date(task.due_time);
    const total = end - start;
    const done = task.status === 'completed';
    let pct, statusLabel, cls;
    if(done){
      pct = 100; cls = 'done';
      statusLabel = 'Completed';
    } else if(now < start){
      pct = 0; cls = '';
      statusLabel = 'Starts in ' + fmtDuration(start-now);
    } else if(now > end){
      pct = 100; cls = 'late';
      statusLabel = 'Overdue by ' + fmtDuration(now-end);
    } else {
      pct = total > 0 ? ((now-start)/total)*100 : 100;
      cls = pct > 75 ? 'warn' : '';
      statusLabel = fmtDuration(end-now) + ' remaining';
    }
    return { pct, cls, statusLabel, isOverdue: !done && now > end };
  }

  function renderRoster(){
    const list = $('#rosterList');
    list.innerHTML = '';
    state.members.forEach(m => {
      const tasks = state.tasks.filter(t => t.member_id === m.id);
      const completed = tasks.filter(t => t.status === 'completed').length;
      const pct = tasks.length ? Math.round((completed/tasks.length)*100) : 0;
      const initials = m.name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();

      const card = document.createElement('div');
      card.className = 'member-card' + (currentMemberFilter === m.id ? ' active' : '');
      card.innerHTML = `
        <div class="member-del" data-del-member="${m.id}">✕</div>
        <div class="member-top">
          <div class="avatar" style="background:${m.color}">${initials}</div>
          <div>
            <div class="member-name">${escapeHtml(m.name)}</div>
            <div class="member-role">${tasks.length} task${tasks.length===1?'':'s'}</div>
          </div>
        </div>
        <div class="mbar-track"><div class="mbar-fill" style="width:${pct}%"></div></div>
        <div class="member-stats"><span>Complete</span><b>${pct}%</b></div>
      `;
      card.addEventListener('click', (e) => {
        if(e.target.closest('[data-del-member]')) return;
        currentMemberFilter = currentMemberFilter === m.id ? null : m.id;
        renderAll();
      });
      list.appendChild(card);
      list.querySelector(`[data-del-member="${m.id}"]`)?.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!confirm(`Remove ${m.name} and unassign their tasks?`)) return;
        await deleteMember(m.id);
      });
    });
    $('#allMembersBtn').classList.toggle('active', currentMemberFilter === null);
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderStats(){
    let pending=0, inprog=0, done=0, overdue=0;
    state.tasks.forEach(t => {
      if(t.status === 'pending') pending++;
      if(t.status === 'in_progress') inprog++;
      if(t.status === 'completed') done++;
      const info = taskProgressInfo(t);
      if(info.isOverdue) overdue++;
    });
    $('#statPending').textContent = pending;
    $('#statProgress').textContent = inprog;
    $('#statDone').textContent = done;
    $('#statOverdue').textContent = overdue;
  }

  function visibleTasks(){
    return state.tasks.filter(t => {
      if(currentMemberFilter && t.member_id !== currentMemberFilter) return false;
      if(searchTerm){
        const hay = (t.title + ' ' + (t.description||'')).toLowerCase();
        if(!hay.includes(searchTerm.toLowerCase())) return false;
      }
      return true;
    }).sort((a,b) => new Date(a.due_time) - new Date(b.due_time));
  }

  function fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }

  function renderBoard(){
    const board = $('#board');
    const tasks = visibleTasks();
    board.innerHTML = '';

    COLUMN_DEFS.forEach(col => {
      const colTasks = tasks.filter(t => t.status === col.status);
      const colEl = document.createElement('div');
      colEl.className = 'column';
      colEl.innerHTML = `
        <div class="column-head">
          <span class="col-dot ${col.status}"></span>
          <span class="col-title">${col.title}</span>
          <span class="col-count">${colTasks.length}</span>
          <button class="icon-btn" data-add-status="${col.status}" title="Add task">+</button>
        </div>
        <div class="column-body" data-col-body="${col.status}"></div>
      `;
      board.appendChild(colEl);

      const body = colEl.querySelector('.column-body');
      if(colTasks.length === 0){
        body.innerHTML = `<div class="empty-col">${state.members.length === 0
          ? 'Add a team member, then assign a task here.'
          : 'Nothing here yet.'}</div>`;
      } else {
        colTasks.forEach(t => body.appendChild(renderCard(t)));
      }
    });

    board.querySelectorAll('[data-add-status]').forEach(btn => {
      btn.addEventListener('click', () => openTaskModal(null, btn.dataset.addStatus));
    });
  }

  function renderCard(t){
    const m = memberById(t.member_id);
    const info = taskProgressInfo(t);
    const initials = m ? m.name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase() : '?';
    const fillCls = t.status === 'completed' ? 'done' : info.cls;
    const card = document.createElement('div');
    card.className = 'k-card' + (info.isOverdue ? ' overdue' : '');
    card.innerHTML = `
      <div class="k-card-top">
        <span class="k-status-label ${t.status}">${t.status.replace('_',' ')}</span>
      </div>
      <div class="k-card-title">${escapeHtml(t.title)}</div>
      ${t.description ? `<div class="k-card-desc">${escapeHtml(t.description)}</div>` : ''}
      <div class="k-card-footer">
        <span class="k-due">🚩 Due: ${fmtDate(t.due_time)}</span>
        <span class="k-avatar" title="${m ? escapeHtml(m.name) : 'Unassigned'}" style="background:${m ? m.color : '#c8cede'}">${initials}</span>
      </div>
      <div class="k-gauge"><div class="k-gauge-fill ${fillCls}" style="width:${info.pct}%"></div></div>
      <div class="k-gauge-label ${info.isOverdue ? 'late' : (t.status==='completed'?'done':'')} mono">${info.statusLabel}</div>
      <div class="k-actions">
        ${t.status !== 'completed' ? `<button data-act="complete" data-id="${t.id}">Mark done</button>` : ''}
        ${t.status === 'pending' ? `<button data-act="start" data-id="${t.id}">Start</button>` : ''}
        <button data-act="edit" data-id="${t.id}">Edit</button>
        <button data-act="delete" data-id="${t.id}" class="danger">Delete</button>
      </div>
    `;
    card.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const act = btn.dataset.act;
        if(act === 'complete') await updateTaskStatus(id, 'completed');
        else if(act === 'start') await updateTaskStatus(id, 'in_progress');
        else if(act === 'delete'){ if(confirm('Delete this task?')) await deleteTask(id); }
        else if(act === 'edit'){ const task = state.tasks.find(x => x.id === id); openTaskModal(task); }
      });
    });
    return card;
  }

  function renderAll(){
    renderRoster();
    renderStats();
    renderBoard();
  }

  // ---------- Supabase-backed mutations ----------
  async function addMemberFromInput(){
    const input = $('#newMemberName');
    const name = input.value.trim();
    if(!name) return;
    const color = AVATAR_COLORS[state.members.length % AVATAR_COLORS.length];
    setSyncStatus('syncing', 'Saving…');
    const { data, error } = await supabase.from('members').insert({ name, color }).select().single();
    if(error){ console.error(error); setSyncStatus('', 'Save failed'); return; }
    state.members.push(data);
    input.value = '';
    $('#addMemberRow').style.display = 'none';
    setSyncStatus('ok', 'Synced with Supabase');
    renderAll();
  }

  async function deleteMember(id){
    setSyncStatus('syncing', 'Saving…');
    const { error } = await supabase.from('members').delete().eq('id', id);
    if(error){ console.error(error); setSyncStatus('', 'Delete failed'); return; }
    state.members = state.members.filter(x => x.id !== id);
    state.tasks.forEach(t => { if(t.member_id === id) t.member_id = null; });
    if(currentMemberFilter === id) currentMemberFilter = null;
    setSyncStatus('ok', 'Synced with Supabase');
    renderAll();
  }

  async function updateTaskStatus(id, status){
    setSyncStatus('syncing', 'Saving…');
    const { data, error } = await supabase.from('tasks').update({ status }).eq('id', id).select().single();
    if(error){ console.error(error); setSyncStatus('', 'Save failed'); return; }
    const idx = state.tasks.findIndex(x => x.id === id);
    if(idx > -1) state.tasks[idx] = data;
    setSyncStatus('ok', 'Synced with Supabase');
    renderAll();
  }

  async function deleteTask(id){
    setSyncStatus('syncing', 'Saving…');
    const { error } = await supabase.from('tasks').delete().eq('id', id);
    if(error){ console.error(error); setSyncStatus('', 'Delete failed'); return; }
    state.tasks = state.tasks.filter(x => x.id !== id);
    setSyncStatus('ok', 'Synced with Supabase');
    renderAll();
  }

  async function upsertTask(payload, id){
    setSyncStatus('syncing', 'Saving…');
    let result;
    if(id){
      result = await supabase.from('tasks').update(payload).eq('id', id).select().single();
    } else {
      result = await supabase.from('tasks').insert(payload).select().single();
    }
    if(result.error){ console.error(result.error); setSyncStatus('', 'Save failed'); return false; }
    if(id){
      const idx = state.tasks.findIndex(x => x.id === id);
      if(idx > -1) state.tasks[idx] = result.data;
    } else {
      state.tasks.push(result.data);
    }
    setSyncStatus('ok', 'Synced with Supabase');
    return true;
  }

  // ---------- Excel export (all tasks, one sheet per status) ----------
  const STATUS_LABELS = { pending: 'Pending', in_progress: 'In Progress', completed: 'Completed' };

  function tasksToRows(tasks){
    return tasks
      .slice()
      .sort((a,b) => new Date(a.due_time) - new Date(b.due_time))
      .map(t => {
        const m = memberById(t.member_id);
        return {
          'Task': t.title,
          'Description': t.description || '',
          'Assigned to': m ? m.name : 'Unassigned',
          'Start': t.start_time ? new Date(t.start_time).toLocaleString() : '',
          'Due': t.due_time ? new Date(t.due_time).toLocaleString() : '',
          'Status': STATUS_LABELS[t.status] || t.status
        };
      });
  }

  function exportAllTasks(){
    if(state.tasks.length === 0){
      alert('No tasks yet — nothing to export.');
      return;
    }
    if(typeof XLSX === 'undefined'){
      alert('The Excel export library failed to load. Check your connection and try again.');
      return;
    }

    const wb = XLSX.utils.book_new();
    const colWidths = [ {wch:32}, {wch:42}, {wch:18}, {wch:20}, {wch:20}, {wch:12} ];

    COLUMN_DEFS.forEach(col => {
      const rows = tasksToRows(state.tasks.filter(t => t.status === col.status));
      const ws = rows.length
        ? XLSX.utils.json_to_sheet(rows)
        : XLSX.utils.aoa_to_sheet([['Task','Description','Assigned to','Start','Due','Status']]);
      ws['!cols'] = colWidths;
      XLSX.utils.book_append_sheet(wb, ws, col.title);
    });

    // Combined sheet with everything, in one place
    const allRows = tasksToRows(state.tasks);
    const wsAll = XLSX.utils.json_to_sheet(allRows);
    wsAll['!cols'] = colWidths;
    XLSX.utils.book_append_sheet(wb, wsAll, 'All Tasks');

    const stamp = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `operations-tasks-${stamp}.xlsx`);
  }

  $('#exportCompletedBtn').addEventListener('click', exportAllTasks);

  $('#addMemberBtn').addEventListener('click', () => {
    const row = $('#addMemberRow');
    row.style.display = row.style.display === 'none' ? 'flex' : 'none';
    if(row.style.display === 'flex') $('#newMemberName').focus();
  });
  $('#confirmAddMember').addEventListener('click', addMemberFromInput);
  $('#newMemberName').addEventListener('keydown', (e) => { if(e.key === 'Enter') addMemberFromInput(); });

  $('#allMembersBtn').addEventListener('click', () => { currentMemberFilter = null; renderAll(); });

  $('#searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderBoard();
  });

  $('#refreshBtn').addEventListener('click', async () => {
    const ok = await loadData();
    renderAll();
  });

  // ---------- Task modal ----------
  function populateMemberSelect(){
    const sel = $('#taskMember');
    sel.innerHTML = state.members.map(m => `<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');
  }

  function openTaskModal(task, defaultStatus){
    populateMemberSelect();
    if(state.members.length === 0){
      alert('Add a team member first.');
      return;
    }
    $('#taskModalTitle').textContent = task ? 'Edit task' : 'Assign a task';
    $('#taskId').value = task ? task.id : '';
    $('#taskTitle').value = task ? task.title : '';
    $('#taskDesc').value = task ? (task.description||'') : '';
    $('#taskMember').value = task ? task.member_id : state.members[0].id;
    $('#taskStart').value = task ? toLocalInput(task.start_time) : defaultDT(0);
    $('#taskEnd').value = task ? toLocalInput(task.due_time) : defaultDT(2);
    $('#taskStatus').value = task ? task.status : (defaultStatus || 'pending');
    $('#taskOverlay').classList.add('show');
    $('#taskTitle').focus();
  }
  function toLocalInput(iso){
    if(!iso) return '';
    const d = new Date(iso);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0,16);
  }
  function defaultDT(hoursFromNow){
    const d = new Date(Date.now() + hoursFromNow*3600000);
    d.setSeconds(0,0);
    d.setMinutes(Math.round(d.getMinutes()/5)*5);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0,16);
  }
  function closeTaskModal(){ $('#taskOverlay').classList.remove('show'); }

  $('#addTaskBtn').addEventListener('click', () => openTaskModal(null));
  $('#cancelTaskBtn').addEventListener('click', closeTaskModal);
  $('#taskOverlay').addEventListener('click', (e) => { if(e.target.id === 'taskOverlay') closeTaskModal(); });

  $('#saveTaskBtn').addEventListener('click', async () => {
    const title = $('#taskTitle').value.trim();
    if(!title){ $('#taskTitle').focus(); return; }
    const startLocal = $('#taskStart').value;
    const endLocal = $('#taskEnd').value;
    if(startLocal && endLocal && new Date(endLocal) <= new Date(startLocal)){
      alert('Due time must be after the start time.');
      return;
    }
    const id = $('#taskId').value;
    const payload = {
      title,
      description: $('#taskDesc').value.trim(),
      member_id: $('#taskMember').value,
      start_time: startLocal ? new Date(startLocal).toISOString() : null,
      due_time: endLocal ? new Date(endLocal).toISOString() : null,
      status: $('#taskStatus').value
    };
    const ok = await upsertTask(payload, id || null);
    if(!ok) return;
    closeTaskModal();
    renderAll();
  });

  // ---------- Init ----------
  async function init(){
    tickClock();
    setInterval(tickClock, 1000);
    if(!initClient()) return;
    const ok = await loadData();
    renderAll();
    if(ok){
      subscribeRealtime();
    }
    setInterval(renderBoard, 30000); // keep countdowns live
  }
  init();
})();
</script>
</body>
</html>
