<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusAudit — Reports & Audit Logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green: #1E7A3C;
    --green-deep: #14522A;
    --green-tint: #EAF6EC;
    --green-tint-border: #CFE8D4;
    --bg: #F1F2F4;
    --card: #FFFFFF;
    --border: #E6E7EB;
    --ink: #16181D;
    --ink-soft: #565B66;
    --ink-faint: #9195A0;
    --red-bg: #FCEAEA; --red-ink: #C4302B;
    --amber-bg: #FDF3DC; --amber-ink: #A9760C;
    --green-bg: #E7F5EA; --green-ink2: #1E7A3C;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; }
  button{ font-family:inherit; }
  input{ font-family:inherit; }

  .app{
    display:flex;
    min-height:100vh;
    padding: 22px;
    gap: 0;
  }

  /* ================= SIDEBAR ================= */
  .sidebar{
    width: 232px;
    flex-shrink:0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius) 0 0 var(--radius);
    border-right: none;
    padding: 18px 14px;
    display:flex; flex-direction:column;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding: 4px 6px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background: linear-gradient(155deg, var(--green), var(--green-deep));
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{ width:19px; height:19px; }
  .brand-name{ font-weight:700; font-size:15.5px; letter-spacing:-0.01em; flex:1; }
  .brand-collapse{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
    background:transparent; cursor:pointer;
  }

  .nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding: 9px 10px; border-radius: var(--radius-sm);
    color: var(--ink-soft); font-size:13.5px; font-weight:500;
    text-decoration:none; cursor:pointer; border:none; background:transparent;
    width:100%; text-align:left;
  }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; }
  .nav-item:hover{ background: #F5F6F8; color: var(--ink); }
  .nav-item.active{ background: var(--green-tint); color: var(--green-deep); font-weight:600; }
  .nav-item:focus-visible{ outline:2px solid var(--green); outline-offset:1px; }

  .sidebar-footer{
    border-top: 1px solid var(--border); padding-top: 12px; margin-top: 10px;
    display:flex; align-items:center; gap:10px;
  }
  .user-avatar{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:12.5px; font-weight:700;
  }
  .user-meta{ min-width:0; flex:1; }
  .user-name{ font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-email{ font-size:11px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .logout-btn{ background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:4px; border-radius:5px; flex-shrink:0; }
  .logout-btn:hover{ color:var(--ink); background:#F5F6F8; }
  .logout-btn svg{ width:16px; height:16px; }

  /* ================= MAIN ================= */
  .main{
    flex:1; min-width:0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0 var(--radius) var(--radius) 0;
    display:flex; flex-direction:column;
  }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 26px; border-bottom: 1px solid var(--border);
  }
  .topbar h1{ font-size:20px; font-weight:700; margin:0; letter-spacing:-0.01em; }
  .topbar-right{ display:flex; align-items:center; gap:12px; }
  .icon-circle{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
    background:transparent; cursor:pointer; position:relative;
  }
  .icon-circle svg{ width:17px; height:17px; }
  .icon-circle .dot{
    position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:50%;
    background: var(--red-ink); border:1.5px solid #fff;
  }
  .topbar-avatar{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:12.5px; font-weight:700;
  }

  .tabs{
    display:flex; gap:26px; padding: 0 26px; border-bottom: 1px solid var(--border);
    overflow-x:auto;
  }
  .tab-btn{
    background:none; border:none; cursor:pointer; padding: 14px 2px 12px;
    font-size:13.5px; font-weight:500; color:var(--ink-faint);
    border-bottom: 2px solid transparent; white-space:nowrap;
  }
  .tab-btn:hover{ color: var(--ink); }
  .tab-btn.active{ color: var(--green); font-weight:600; border-bottom-color: var(--green); }
  .tab-btn:focus-visible{ outline:2px solid var(--green); outline-offset:2px; }

  .toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding: 16px 26px; flex-wrap:wrap;
  }
  .toolbar-left{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .search-box{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--border); border-radius:8px; padding: 8px 12px;
    min-width: 240px; color: var(--ink-faint);
  }
  .search-box svg{ width:15px; height:15px; flex-shrink:0; }
  .search-box input{
    border:none; outline:none; background:transparent; font-size:13px; color:var(--ink); width:100%;
  }
  .select-wrap{
    position:relative;
  }
  .select-wrap select{
    appearance:none; -webkit-appearance:none;
    border:1px solid var(--border); border-radius:8px; padding: 8px 30px 8px 12px;
    font-size:13px; color:var(--ink-soft); background:transparent; cursor:pointer;
  }
  .select-wrap svg{
    position:absolute; right:9px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; color:var(--ink-faint); pointer-events:none;
  }
  .toolbar-right{ display:flex; align-items:center; gap:10px; }
  .export-label{ font-size:12.5px; color:var(--ink-faint); margin-right:2px; }
  .export-btn{
    border:1px solid var(--border); background:transparent; border-radius:8px;
    padding: 8px 14px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .export-btn:hover{ border-color:var(--green); color:var(--green); background:var(--green-tint); }
  .export-btn:focus-visible{ outline:2px solid var(--green); outline-offset:1px; }

  /* ================= TABLE ================= */
  .table-wrap{ padding: 0 26px; overflow-x:auto; flex:1; }
  table{ width:100%; border-collapse:collapse; min-width: 980px; }
  thead th{
    text-align:left; font-size:11.5px; text-transform:none; font-weight:600;
    color: var(--ink-faint); background: #FAFAFB;
    padding: 11px 14px; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  thead th:first-child{ border-top-left-radius:8px; }
  thead th:last-child{ border-top-right-radius:8px; }
  tbody td{
    padding: 13px 14px; border-bottom:1px solid var(--border);
    font-size:13px; color:var(--ink); white-space:nowrap;
  }
  tbody tr:hover{ background: #FAFAFB; }
  .cell-check{ width:34px; }
  .cell-check input{ width:15px; height:15px; accent-color:var(--green); cursor:pointer; }
  .cell-person{ display:flex; align-items:center; gap:9px; }
  .cell-avatar{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:700;
  }
  .cell-sub{ color:var(--ink-faint); font-size:11.5px; }
  .pill{
    display:inline-block; font-size:11.5px; font-weight:600; padding: 4px 10px; border-radius:20px;
  }
  .pill.ok{ background:var(--green-bg); color:var(--green-ink2); }
  .pill.warn{ background:var(--amber-bg); color:var(--amber-ink); }
  .pill.bad{ background:var(--red-bg); color:var(--red-ink); }
  .bar-cell{ display:flex; align-items:center; gap:8px; }
  .bar-track{ width:56px; height:6px; border-radius:3px; background:var(--border); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:3px; }
  .empty-row td{ text-align:center; color:var(--ink-faint); padding: 40px 14px; font-size:13px; }

  .subject-input{
    width: 168px; border:1px solid var(--border); border-radius:7px;
    padding: 7px 10px; font-size:12.5px; color:var(--ink); background:transparent;
  }
  .subject-input:focus-visible{ outline:2px solid var(--green); outline-offset:1px; }
  .subject-input::placeholder{ color: var(--ink-faint); }

  .crit-btn{
    width:28px; height:28px; border-radius:7px; border:1.5px solid var(--border);
    background:transparent; cursor:pointer; font-size:12px; font-weight:700;
    display:inline-flex; align-items:center; justify-content:center; color:var(--ink-faint);
    transition: transform .1s ease;
  }
  .crit-btn:hover{ transform: scale(1.06); }
  .crit-btn.on{ background:var(--green-bg); border-color:var(--green); color:var(--green-ink2); }
  .crit-btn.off{ background:var(--red-bg); border-color:var(--red-ink); color:var(--red-ink); }
  .crit-btn:focus-visible{ outline:2px solid var(--green); outline-offset:1px; }

  /* ================= FOOTER / PAGINATION ================= */
  .table-footer{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 26px 22px; flex-wrap:wrap; gap:10px;
  }
  .page-info{ font-size:12.5px; color:var(--ink-faint); }
  .pager{ display:flex; align-items:center; gap:6px; }
  .pg-btn{
    min-width:32px; height:32px; padding:0 8px; border-radius:7px; border:1px solid var(--border);
    background:transparent; color:var(--ink-soft); font-size:12.5px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .pg-btn:hover{ border-color: var(--green); color:var(--green); }
  .pg-btn[disabled]{ opacity:.4; cursor:not-allowed; }
  .pg-btn[disabled]:hover{ border-color:var(--border); color:var(--ink-soft); }
  .pg-btn.active{ background:var(--green); border-color:var(--green); color:#fff; font-weight:600; }
  .pg-btn svg{ width:14px; height:14px; }
  .pg-ellipsis{ color:var(--ink-faint); font-size:12.5px; padding:0 2px; }

  .toast{
    position: fixed; bottom: 22px; left:50%; transform: translateX(-50%) translateY(12px);
    background: var(--ink); color: #fff; font-size:12.5px;
    padding: 10px 18px; border-radius: 8px; opacity:0; pointer-events:none;
    transition: opacity .25s ease, transform .25s ease; z-index: 50;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 900px){
    .app{ padding:0; }
    .sidebar{ display:none; }
    .main{ border-radius:0; border-left:none; border-right:none; }
  }

  @media print{
    body{ background:#fff; }
    .sidebar, .topbar-right, .tabs, .toolbar, .table-footer, .toast{ display:none !important; }
    .app{ padding:0; }
    .main{ border:none; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ================= SIDEBAR ================= -->

      <button class="nav-item active" id="nav-reports" data-nav data-page="reports" aria-current="page">

    <div class="sidebar-footer">

  <!-- ================= MAIN ================= -->
  <main class="main">
    <div class="topbar">

<script>
(function(){
  "use strict";

  // ---------------- deterministic RNG ----------------
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(2026);
  function pick(arr){ return arr[Math.floor(rng()*arr.length)]; }
  function randInt(min,max){ return Math.floor(rng()*(max-min+1))+min; }

  const FIRST = ["Milo","Juniper","Hazel","Jemmy","Jasper","Owen","Silo","Scarlett","Luna","Willow","Rowan","Arlo","Sage","Wren","Finn","Nova","Ezra","Ivy","Kai","Maren","Theo","Elowen","Cass","Briar","Odin","Marlowe","Fable","Ash","Reeve","Talia"];
  const LAST = ["Fairbanks","Skye","Willow","Henry","Thorne","Jack","Woods","Rose","Maeve","Sage","Ellery","Marsh","Quill","Rivers","Blackwood","Fenwick","Harrow","Lockhart","Vance","Wilder","Sterling","Ashby","Crane","Doyle","Merrow"];
  const SKILLS = ["Data Structures","React Fundamentals","SQL & Databases","API Design","UI/UX Basics","Public Speaking","Python Automation","Cloud Deployment","Git & Version Control","Problem Solving"];
  const TASK_NAMES = ["Unit 4 Quiz","Midterm Assignment","Sprint Retrospective Quiz","Capstone Draft","Weekly Concept Check","Peer Review Assignment","Lab Assessment","Case Study Submission"];
  const MENTORS = Array.from({length:12}, () => pick(FIRST) + " " + pick(LAST));
  const uniqMentors = [...new Set(MENTORS)];

  function fullName(){ return pick(FIRST) + " " + pick(LAST); }
  function randDate(){
    const d = new Date(2025, randInt(0,11), randInt(1,28));
    return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
  }
  function initials(name){ return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
  const AVATAR_COLORS = ["#1E7A3C","#B9526B","#8C5FC4","#C9822B","#2E7BB0","#4C8B6B","#B0533C","#6B6FCB"];
  function avatarColor(name){
    let h=0; for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  // ---------------- generate datasets ----------------
  function genWeekly(n){
    const rows = [];
    for(let i=0;i<n;i++){
      const student = fullName();
      const mentor = pick(uniqMentors);
      const planned = randInt(6,12);
      const completed = randInt(0, planned);
      const pct = Math.round((completed/planned)*100);
      const status = pct >= 90 ? "Completed" : pct >= 50 ? "Partial" : "Not Completed";
      rows.push({
        id: "#WPL-" + randInt(10000,99999),
        week: "Week " + randInt(1,20),
        student, mentor,
        planned, completed, pct,
        date: randDate(), status
      });
    }
    return rows;
  }
  const CRITERIA_KEYS = ["genuine","weeklyPlan","tracker","assignment","assessment"];
  const CRITERIA_LABELS = {
    genuine: "Genuinely Marked",
    weeklyPlan: "Weekly Plan Completed",
    tracker: "Daily Tracker Updated",
    assignment: "Assignment Completed",
    assessment: "Assessment Completed"
  };

  function randCriteria(){
    const c = {};
    CRITERIA_KEYS.forEach(k => { c[k] = rng() < 0.68; });
    return c;
  }
  function scoreFromCriteria(c){
    const met = CRITERIA_KEYS.filter(k => c[k]).length;
    return Math.round((met / CRITERIA_KEYS.length) * 100);
  }
  function statusFromScore(pct){
    return pct >= 80 ? "Achieved" : pct >= 50 ? "In Progress" : "Not Achieved";
  }

  function genSkill(n){
    const rows = [];
    for(let i=0;i<n;i++){
      const criteria = randCriteria();
      const score = scoreFromCriteria(criteria);
      rows.push({
        uid: "skl-" + i,
        id: "#SKL-" + randInt(10000,99999),
        week: "Week " + randInt(1,20),
        student: fullName(), mentor: pick(uniqMentors),
        subject: pick(SKILLS),
        criteria, score,
        date: randDate(), status: statusFromScore(score)
      });
    }
    return rows;
  }
  function recomputeSkillRow(row){
    row.score = scoreFromCriteria(row.criteria);
    row.status = statusFromScore(row.score);
  }
  function genAcademic(n){
    const rows = [];
    for(let i=0;i<n;i++){
      const type = pick(["Quiz","Assignment"]);
      const score = randInt(0,100);
      const status = score === 0 ? "Missing" : score < 50 ? "Late" : "Submitted";
      rows.push({
        id: "#ACD-" + randInt(10000,99999),
        week: "Week " + randInt(1,20),
        student: fullName(), mentor: pick(uniqMentors),
        type, task: pick(TASK_NAMES), score,
        date: randDate(), status
      });
    }
    return rows;
  }
  function genAttendance(n){
    const rows = [];
    for(let i=0;i<n;i++){
      const held = randInt(8,12);
      const attended = randInt(0, held);
      const pct = Math.round((attended/held)*100);
      const status = pct >= 85 ? "Good" : pct >= 65 ? "Warning" : "Critical";
      rows.push({
        id: "#ATD-" + randInt(10000,99999),
        week: "Week " + randInt(1,20),
        student: fullName(), mentor: pick(uniqMentors),
        held, attended, pct, date: randDate(), status
      });
    }
    return rows;
  }

  const DATA = {
    weekly: genWeekly(46),
    skill: genSkill(46),
    academic: genAcademic(46),
    attendance: genAttendance(46)
  };

  const STATUS_MAP = {
    "Completed":"ok","Achieved":"ok","Submitted":"ok","Good":"ok",
    "Partial":"warn","In Progress":"warn","Late":"warn","Warning":"warn",
    "Not Completed":"bad","Not Achieved":"bad","Missing":"bad","Critical":"bad"
  };

  const TAB_CONFIG = {
    weekly: {
      label: "Weekly Plan Submissions",
      minWidth: 980,
      cols: ["Submission ID","Week","Student Name","Mentor Name","Planned Tasks","Completed","Completion","Submitted On","Status"],
      row(r){ return [
        r.id, r.week,
        personCell(r.student), mentorCell(r.mentor),
        r.planned, r.completed,
        barCell(r.pct),
        r.date, pillCell(r.status)
      ]; },
      exportRow(r){ return [r.id, r.week, r.student, r.mentor, r.planned, r.completed, r.pct + "%", r.date, r.status]; }
    },
    skill: {
      label: "Skill Development",
      minWidth: 1580,
      cols: ["Log ID","Week","Student Name","Mentor Name","Skill Development Subject","Genuine Marking","Weekly Plan","Daily Tracker","Assignment","Assessment","Score","Submitted On","Status"],
      row(r){ return [
        r.id, r.week,
        personCell(r.student), mentorCell(r.mentor),
        subjectCell(r),
        criteriaToggle(r,"genuine"), criteriaToggle(r,"weeklyPlan"), criteriaToggle(r,"tracker"),
        criteriaToggle(r,"assignment"), criteriaToggle(r,"assessment"),
        barCell(r.score),
        r.date, pillCell(r.status)
      ]; },
      exportRow(r){ return [
        r.id, r.week, r.student, r.mentor, r.subject,
        r.criteria.genuine ? "Yes" : "No", r.criteria.weeklyPlan ? "Yes" : "No",
        r.criteria.tracker ? "Yes" : "No", r.criteria.assignment ? "Yes" : "No",
        r.criteria.assessment ? "Yes" : "No",
        r.score + "/100", r.date, r.status
      ]; }
    },
    academic: {
      label: "Academic Tasks",
      minWidth: 980,
      cols: ["Task ID","Week","Student Name","Task Type","Task Name","Score","Submitted On","Status"],
      row(r){ return [
        r.id, r.week,
        personCell(r.student), r.type,
        r.task, r.score + "/100",
        r.date, pillCell(r.status)
      ]; },
      exportRow(r){ return [r.id, r.week, r.student, r.type, r.task, r.score + "/100", r.date, r.status]; }
    },
    attendance: {
      label: "Attendance",
      minWidth: 980,
      cols: ["Record ID","Week","Student Name","Mentor Name","Classes Held","Attended","Attendance","Submitted On","Status"],
      row(r){ return [
        r.id, r.week,
        personCell(r.student), mentorCell(r.mentor),
        r.held, r.attended,
        barCell(r.pct),
        r.date, pillCell(r.status)
      ]; },
      exportRow(r){ return [r.id, r.week, r.student, r.mentor, r.held, r.attended, r.pct + "%", r.date, r.status]; }
    }
  };

  function escapeAttr(s){ return String(s).replace(/"/g,"&quot;"); }

  function subjectCell(r){
    return `<input type="text" class="subject-input" data-uid="${r.uid}" value="${escapeAttr(r.subject)}" placeholder="Enter subject" aria-label="Skill development subject">`;
  }
  function criteriaToggle(r, key){
    const on = !!r.criteria[key];
    return `<button type="button" class="crit-btn ${on ? "on" : "off"}" data-uid="${r.uid}" data-key="${key}" title="${CRITERIA_LABELS[key]}" aria-pressed="${on}">${on ? "✓" : "✕"}</button>`;
  }

  function personCell(name){
    return `<div class="cell-person"><div class="cell-avatar" style="background:${avatarColor(name)}">${initials(name)}</div>${name}</div>`;
  }
  function mentorCell(name){
    return `<div class="cell-person"><div class="cell-avatar" style="background:${avatarColor(name)}">${initials(name)}</div>${name}</div>`;
  }
  function pillCell(status){
    const cls = STATUS_MAP[status] || "warn";
    return `<span class="pill ${cls}">${status}</span>`;
  }
  function barCell(pct){
    const color = pct >= 80 ? "var(--green-ink2)" : pct >= 50 ? "var(--amber-ink)" : "var(--red-ink)";
    return `<div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><span style="font-size:12px;color:${color};font-weight:600">${pct}%</span></div>`;
  }

  // ---------------- state ----------------
  let state = { tab: "weekly", search: "", mentor: "", status: "", page: 1, pageSize: 10 };

  function filteredRows(){
    const raw = DATA[state.tab];
    return raw.filter(r => {
      if(state.search){
        const q = state.search.toLowerCase();
        const hay = (r.student + " " + (r.mentor||"")).toLowerCase();
        if(!hay.includes(q)) return false;
      }
      if(state.mentor && r.mentor !== state.mentor) return false;
      if(state.status && r.status !== state.status) return false;
      return true;
    });
  }

  function uniqueStatuses(){
    const cfg = TAB_CONFIG[state.tab];
    const set = new Set(DATA[state.tab].map(r => r.status));
    return [...set];
  }

  function populateFilters(){
    const mentorSel = document.getElementById("mentorFilter");
    const statusSel = document.getElementById("statusFilter");
    const hasMentor = DATA[state.tab][0].mentor !== undefined;

    mentorSel.innerHTML = '<option value="">Mentor</option>' +
      uniqMentors.map(m => `<option value="${m}">${m}</option>`).join("");
    mentorSel.parentElement.style.display = hasMentor ? "" : "none";

    statusSel.innerHTML = '<option value="">Status</option>' +
      uniqueStatuses().map(s => `<option value="${s}">${s}</option>`).join("");
  }

  function render(){
    const cfg = TAB_CONFIG[state.tab];
    document.title = "CampusAudit — " + cfg.label;

    document.querySelector(".table-wrap table").style.minWidth = (cfg.minWidth || 980) + "px";

    // thead
    const thead = document.getElementById("theadRow");
    thead.innerHTML = `<th class="cell-check"><input type="checkbox" aria-label="Select all"></th>` +
      cfg.cols.map(c => `<th>${c}</th>`).join("");

    const all = filteredRows();
    const totalPages = Math.max(1, Math.ceil(all.length / state.pageSize));
    if(state.page > totalPages) state.page = totalPages;
    const start = (state.page - 1) * state.pageSize;
    const pageRows = all.slice(start, start + state.pageSize);

    const tbody = document.getElementById("tbody");
    if(pageRows.length === 0){
      tbody.innerHTML = `<tr class="empty-row"><td colspan="${cfg.cols.length+1}">No records match your filters.</td></tr>`;
    } else {
      tbody.innerHTML = pageRows.map(r => {
        const cells = cfg.row(r);
        return `<tr><td class="cell-check"><input type="checkbox" aria-label="Select row"></td>` +
          cells.map(c => `<td>${c}</td>`).join("") + `</tr>`;
      }).join("");
    }

    document.getElementById("pageInfo").textContent = `Page ${state.page} of ${totalPages} · ${all.length} records`;
    renderPager(totalPages);
  }

  function renderPager(totalPages){
    const pager = document.getElementById("pager");
    pager.innerHTML = "";

    const prev = document.createElement("button");
    prev.className = "pg-btn"; prev.disabled = state.page <= 1;
    prev.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Previous`;
    prev.addEventListener("click", () => { if(state.page>1){ state.page--; render(); } });
    pager.appendChild(prev);

    const pages = pageList(state.page, totalPages);
    pages.forEach(p => {
      if(p === "..."){
        const span = document.createElement("span");
        span.className = "pg-ellipsis"; span.textContent = "…";
        pager.appendChild(span);
      } else {
        const b = document.createElement("button");
        b.className = "pg-btn" + (p === state.page ? " active" : "");
        b.textContent = p;
        b.addEventListener("click", () => { state.page = p; render(); });
        pager.appendChild(b);
      }
    });

    const next = document.createElement("button");
    next.className = "pg-btn"; next.disabled = state.page >= totalPages;
    next.innerHTML = `Next <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;
    next.addEventListener("click", () => { if(state.page<totalPages){ state.page++; render(); } });
    pager.appendChild(next);
  }

  function pageList(cur, total){
    if(total <= 7) return Array.from({length: total}, (_,i)=>i+1);
    const out = [1];
    if(cur > 3) out.push("...");
    for(let p = Math.max(2, cur-1); p <= Math.min(total-1, cur+1); p++) out.push(p);
    if(cur < total-2) out.push("...");
    out.push(total);
    return out;
  }

  // ---------------- events ----------------
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.tab = btn.dataset.tab;
      state.search = ""; document.getElementById("searchInput").value = "";
      state.mentor = ""; state.status = ""; state.page = 1;
      populateFilters();
      render();
    });
  });

  document.getElementById("searchInput").addEventListener("input", e => {
    state.search = e.target.value; state.page = 1; render();
  });
  document.getElementById("mentorFilter").addEventListener("change", e => {
    state.mentor = e.target.value; state.page = 1; render();
  });
  document.getElementById("statusFilter").addEventListener("change", e => {
    state.status = e.target.value; state.page = 1; render();
  });

  document.getElementById("tbody").addEventListener("input", e => {
    if(e.target.matches(".subject-input")){
      const row = DATA.skill.find(r => r.uid === e.target.dataset.uid);
      if(row) row.subject = e.target.value;
    }
  });
  document.getElementById("tbody").addEventListener("click", e => {
    const btn = e.target.closest(".crit-btn");
    if(!btn) return;
    const row = DATA.skill.find(r => r.uid === btn.dataset.uid);
    if(!row) return;
    row.criteria[btn.dataset.key] = !row.criteria[btn.dataset.key];
    recomputeSkillRow(row);
    render();
    toast(CRITERIA_LABELS[btn.dataset.key] + ": " + (row.criteria[btn.dataset.key] ? "marked" : "unmarked"));
  });

  let toastTimer;
  function toast(msg){
    const el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove("show"), 2200);
  }

  document.getElementById("exportCsv").addEventListener("click", () => {
    const cfg = TAB_CONFIG[state.tab];
    const rows = filteredRows();
    const header = cfg.cols.join(",");
    const lines = rows.map(r => {
      return cfg.exportRow(r).map(v => `"${String(v).replace(/"/g,'""')}"`).join(",");
    });
    const csv = header + "\n" + lines.join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = cfg.label.replace(/[^a-z0-9]+/gi,"_") + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast("Exported " + rows.length + " rows as CSV");
  });

  document.getElementById("exportPdf").addEventListener("click", () => {
    toast("Preparing PDF — use the print dialog to save");
    setTimeout(() => window.print(), 300);
  });

  document.querySelectorAll(".nav-item").forEach(btn => {
    if(!btn.classList.contains("active")){
      btn.addEventListener("click", () => toast(btn.textContent.trim() + " — coming soon"));
  
    }
  });

  populateFilters();
  render();
})();
</script>
</body>
</html>
